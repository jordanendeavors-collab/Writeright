  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Grammar analysis engine
    const analyzeGrammar = (text) => {
      const corrections = [];
      let correctedText = text;
      
      const rules = [
        { pattern: /\bi seen\b/gi, replacement: "I saw", rule: "Past tense of 'see'", explanation: "'Seen' needs a helper verb (have/had). On its own, use 'saw'.", category: "grammar" },
        { pattern: /\byour\s+(going|doing|coming|leaving|installing|working|trying|getting|making|taking|running|saying|gonna|gunna|welcome)\b/gi, replacement: "you're $1", rule: "You're vs Your", explanation: "'You're' = 'you are'. 'Your' = possession (your truck, your tools).", category: "word_choice" },
        { pattern: /\balot\b/gi, replacement: "a lot", rule: "Two words, always", explanation: "'A lot' is always two words. 'Alot' isn't a word.", category: "grammar" },
        { pattern: /\bshould of\b/gi, replacement: "should have", rule: "Should HAVE, not 'of'", explanation: "It sounds like 'of' when spoken fast, but it's 'have'.", category: "grammar" },
        { pattern: /\bcould of\b/gi, replacement: "could have", rule: "Could HAVE, not 'of'", explanation: "It sounds like 'of' when spoken fast, but it's 'have'.", category: "grammar" },
        { pattern: /\bwould of\b/gi, replacement: "would have", rule: "Would HAVE, not 'of'", explanation: "It sounds like 'of' when spoken fast, but it's 'have'.", category: "grammar" },
        { pattern: /\btheres\b/gi, replacement: "there's", rule: "Apostrophe needed", explanation: "'There's' = 'there is'. Apostrophe marks the missing 'i'.", category: "punctuation" },
        { pattern: /\bdont\b/gi, replacement: "don't", rule: "Apostrophe needed", explanation: "'Don't' = 'do not'. Apostrophe marks missing 'o'.", category: "punctuation" },
        { pattern: /\bcant\b/gi, replacement: "can't", rule: "Apostrophe needed", explanation: "'Can't' = 'cannot'. Apostrophe marks missing letters.", category: "punctuation" },
        { pattern: /\bwont\b/gi, replacement: "won't", rule: "Apostrophe needed", explanation: "'Won't' = 'will not'.", category: "punctuation" },
        { pattern: /\bim\b/gi, replacement: "I'm", rule: "Capitalize I + apostrophe", explanation: "'I'm' = 'I am'. Always capitalize 'I'.", category: "punctuation" },
        { pattern: /\bi\s/g, replacement: "I ", rule: "Capitalize 'I'", explanation: "The pronoun 'I' is always capitalized.", category: "grammar" },
        { pattern: /\btheir\s+(is|are|was|were|a\s|an\s|going|gonna)\b/gi, replacement: "there $1", rule: "There vs Their", explanation: "'There' = location/existence. 'Their' = belonging to them.", category: "word_choice" },
        { pattern: /\bthen\s+(me|him|her|them|us|I)\b/gi, replacement: "than $1", rule: "Than vs Then", explanation: "'Than' for comparisons. 'Then' for time.", category: "word_choice" },
        { pattern: /\bmore\s+better\b/gi, replacement: "better", rule: "Double comparative", explanation: "'Better' already means 'more good'. Don't double up.", category: "grammar" },
        { pattern: /\birregardless\b/gi, replacement: "regardless", rule: "Not a standard word", explanation: "Just use 'regardless' - it means the same thing.", category: "word_choice" },
        { pattern: /\bsupposably\b/gi, replacement: "supposedly", rule: "Mispronunciation", explanation: "It's 'supposedly' not 'supposably'.", category: "word_choice" },
        { pattern: /\bpacifically\b/gi, replacement: "specifically", rule: "Mispronunciation", explanation: "It's 'specifically'. 'Pacifically' means peacefully.", category: "word_choice" },
        { pattern: /\bexpresso\b/gi, replacement: "espresso", rule: "Misspelling", explanation: "No 'x' in espresso - it's Italian.", category: "word_choice" },
        { pattern: /\bfor all intensive purposes\b/gi, replacement: "for all intents and purposes", rule: "Common mishearing", explanation: "It's 'intents and purposes' not 'intensive purposes'.", category: "word_choice" },
        { pattern: /\bgonna\b/gi, replacement: "going to", rule: "Informal", explanation: "'Gonna' is slang. Write 'going to' for professional messages.", category: "grammar" },
        { pattern: /\bwanna\b/gi, replacement: "want to", rule: "Informal", explanation: "'Wanna' is slang. Write 'want to' for clarity.", category: "grammar" },
        { pattern: /\bgotta\b/gi, replacement: "got to", rule: "Informal", explanation: "'Gotta' is slang. Write 'got to' or 'have to'.", category: "grammar" },
        { pattern: /\bkinda\b/gi, replacement: "kind of", rule: "Informal", explanation: "'Kinda' is casual. Write 'kind of' in messages.", category: "grammar" },
        { pattern: /\bsorta\b/gi, replacement: "sort of", rule: "Informal", explanation: "'Sorta' is casual. Write 'sort of' in messages.", category: "grammar" },
        { pattern: /\bdunno\b/gi, replacement: "don't know", rule: "Informal", explanation: "'Dunno' is super casual. Write 'don't know'.", category: "grammar" },
        { pattern: /\blemme\b/gi, replacement: "let me", rule: "Informal", explanation: "'Lemme' is slang. Write 'let me' for clarity.", category: "grammar" },
        { pattern: /\bgimme\b/gi, replacement: "give me", rule: "Informal", explanation: "'Gimme' is slang. Write 'give me'.", category: "grammar" },
        { pattern: /\bwouldnt\b/gi, replacement: "wouldn't", rule: "Apostrophe needed", explanation: "'Wouldn't' = 'would not'.", category: "punctuation" },
        { pattern: /\bcouldnt\b/gi, replacement: "couldn't", rule: "Apostrophe needed", explanation: "'Couldn't' = 'could not'.", category: "punctuation" },
        { pattern: /\bshouldnt\b/gi, replacement: "shouldn't", rule: "Apostrophe needed", explanation: "'Shouldn't' = 'should not'.", category: "punctuation" },
        { pattern: /\btheyre\b/gi, replacement: "they're", rule: "Apostrophe needed", explanation: "'They're' = 'they are'.", category: "punctuation" },
        { pattern: /\bwere\s+(gonna|going to|coming|leaving)\b/gi, replacement: "we're $1", rule: "We're vs Were", explanation: "'We're' = 'we are'. 'Were' is past tense of 'are'.", category: "word_choice" },
        { pattern: /\bits\s+(going|gonna|a\s|the\s|not|been|time|important)\b/gi, replacement: "it's $1", rule: "It's vs Its", explanation: "'It's' = 'it is'. 'Its' = possession.", category: "word_choice" },
      ];

      rules.forEach(rule => {
        const matches = text.match(rule.pattern);
        if (matches) {
          matches.forEach(match => {
            const corrected = match.replace(rule.pattern, rule.replacement);
            if (!corrections.find(c => c.original.toLowerCase() === match.toLowerCase())) {
              corrections.push({
                id: Math.random().toString(36).substr(2, 9),
                original: match,
                corrected: corrected,
                rule: rule.rule,
                explanation: rule.explanation,
                category: rule.category
              });
            }
          });
          correctedText = correctedText.replace(rule.pattern, rule.replacement);
        }
      });

      // Capitalize first letter of sentences
      correctedText = correctedText.replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase());

      const score = Math.max(0, Math.min(100, 100 - (corrections.length * 10)));
      return { correctedText, corrections, score };
    };

    // Main App Component
    function WriteRight() {
      const [screen, setScreen] = useState('home');
      const [isRecording, setIsRecording] = useState(false);
      const [recordingTime, setRecordingTime] = useState(0);
      const [waveform, setWaveform] = useState([]);
      const [originalText, setOriginalText] = useState('');
      const [correctedText, setCorrectedText] = useState('');
      const [corrections, setCorrections] = useState([]);
      const [score, setScore] = useState(null);
      const [selectedCorrection, setSelectedCorrection] = useState(null);
      const [correctionMode, setCorrectionMode] = useState('learn');
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [isListening, setIsListening] = useState(false);
      const [interimTranscript, setInterimTranscript] = useState('');
      const [micPermission, setMicPermission] = useState('unknown');
      const [drivingMode, setDrivingMode] = useState(false);
      const [statusMessage, setStatusMessage] = useState('');
      const [history, setHistory] = useState([]);
      
      const timerRef = useRef(null);
      const waveRef = useRef(null);
      const recognitionRef = useRef(null);
      const audioContextRef = useRef(null);
      const analyserRef = useRef(null);
      const mediaStreamRef = useRef(null);

      // Initialize Speech Recognition
      useEffect(() => {
        if (typeof window !== 'undefined') {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (SpeechRecognition) {
            recognitionRef.current = new SpeechRecognition();
            recognitionRef.current.continuous = true;
            recognitionRef.current.interimResults = true;
            recognitionRef.current.lang = 'en-US';

            recognitionRef.current.onresult = (event) => {
              let interim = '';
              let final = '';
              
              for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                  final += transcript + ' ';
                } else {
                  interim += transcript;
                }
              }
              
              if (final) {
                setOriginalText(prev => prev + final);
              }
              setInterimTranscript(interim);
            };

            recognitionRef.current.onerror = (event) => {
              if (event.error === 'not-allowed') {
                setMicPermission('denied');
                setStatusMessage('Microphone access needed');
              }
            };

            recognitionRef.current.onend = () => {
              if (isListening) {
                try { recognitionRef.current.start(); } catch(e) {}
              }
            };
          }
        }
        
        return () => {
          if (recognitionRef.current) {
            try { recognitionRef.current.stop(); } catch(e) {}
          }
        };
      }, [isListening]);

      // Waveform
      useEffect(() => {
        if (isRecording && mediaStreamRef.current) {
          const updateWaveform = () => {
            if (analyserRef.current) {
              const dataArray = new Uint8Array(analyserRef.current.frequencyBinCount);
              analyserRef.current.getByteFrequencyData(dataArray);
              const average = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
              
              setWaveform(prev => [...prev, (average / 255) * 100].slice(-50));
            }
            
            if (isRecording) {
              waveRef.current = requestAnimationFrame(updateWaveform);
            }
          };
          updateWaveform();
        }
        
        return () => {
          if (waveRef.current) cancelAnimationFrame(waveRef.current);
        };
      }, [isRecording]);

      // Timer
      useEffect(() => {
        if (isRecording) {
          timerRef.current = setInterval(() => setRecordingTime(prev => prev + 1), 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [isRecording]);

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins}:${secs.toString().padStart(2, '0')}`;
      };

      const startRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaStreamRef.current = stream;
          setMicPermission('granted');
          
          audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
          analyserRef.current = audioContextRef.current.createAnalyser();
          const source = audioContextRef.current.createMediaStreamSource(stream);
          source.connect(analyserRef.current);
          analyserRef.current.fftSize = 256;
          
          if (recognitionRef.current) {
            recognitionRef.current.start();
            setIsListening(true);
          }
          
          setIsRecording(true);
          setRecordingTime(0);
          setWaveform([]);
          setOriginalText('');
          setInterimTranscript('');
          setCorrectedText('');
          setCorrections([]);
          setScore(null);
          setStatusMessage('Listening...');
          
        } catch (err) {
          setMicPermission('denied');
          setStatusMessage('Microphone access needed');
        }
      };

      const stopRecording = () => {
        setIsRecording(false);
        setIsListening(false);
        
        if (recognitionRef.current) try { recognitionRef.current.stop(); } catch(e) {}
        if (mediaStreamRef.current) mediaStreamRef.current.getTracks().forEach(track => track.stop());
        if (audioContextRef.current) try { audioContextRef.current.close(); } catch(e) {}
        
        const finalText = (originalText + ' ' + interimTranscript).trim();
        setOriginalText(finalText);
        setInterimTranscript('');
        setStatusMessage('');
        
        if (finalText) {
          setScreen('review');
        } else {
          setStatusMessage('No speech detected');
          setTimeout(() => setStatusMessage(''), 2000);
        }
      };

      const analyzeText = () => {
        setIsAnalyzing(true);
        
        setTimeout(() => {
          const result = analyzeGrammar(originalText);
          setCorrectedText(result.correctedText);
          setCorrections(result.corrections);
          setScore(result.score);
          setIsAnalyzing(false);
          
          setHistory(prev => [{
            id: Date.now(),
            timestamp: new Date().toLocaleString(),
            original: originalText,
            corrected: result.correctedText,
            score: result.score,
            corrections: result.corrections.length
          }, ...prev].slice(0, 50));
          
          if (drivingMode && result.corrections.length > 0) {
            speakText(`Fixed ${result.corrections.length} issue${result.corrections.length > 1 ? 's' : ''}. Ready to send.`);
          } else if (drivingMode) {
            speakText('Perfect! No corrections needed.');
          }
        }, 500);
      };

      const speakText = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 0.95;
          window.speechSynthesis.speak(utterance);
        }
      };

      const copyToClipboard = async () => {
        const text = correctedText || originalText;
        try {
          await navigator.clipboard.writeText(text);
        } catch (err) {
          const textArea = document.createElement('textarea');
          textArea.value = text;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
        }
        setStatusMessage('✓ Copied!');
        setTimeout(() => setStatusMessage(''), 2000);
      };

      const shareText = async () => {
        const text = correctedText || originalText;
        if (navigator.share) {
          try { await navigator.share({ text }); } 
          catch (err) { window.location.href = `sms:?body=${encodeURIComponent(text)}`; }
        } else {
          window.location.href = `sms:?body=${encodeURIComponent(text)}`;
        }
      };

      const getCategoryIcon = (category) => {
        switch(category) {
          case 'grammar': return '📝';
          case 'word_choice': return '🔤';
          case 'punctuation': return '✏️';
          default: return '📋';
        }
      };

      // HOME SCREEN
      const HomeScreen = () => (
        <div className="flex flex-col h-full">
          <div className="px-5 pt-6 pb-3">
            <div className="flex items-center justify-between">
              <div>
                <h1 className="text-2xl font-black text-white tracking-tight">
                  <span className="text-emerald-400">Write</span>
                  <span className="text-white">Right</span>
                </h1>
                <p className="text-zinc-500 text-xs mt-0.5">Speak it. Send it right.</p>
              </div>
              <button onClick={() => setScreen('settings')} className="w-10 h-10 rounded-full bg-zinc-800/80 flex items-center justify-center border border-zinc-700/50">
                <svg className="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
              </button>
            </div>
          </div>

          <div className="px-5 mb-4">
            <button 
              onClick={() => setDrivingMode(!drivingMode)}
              className={`w-full p-3.5 rounded-2xl flex items-center justify-between border transition-all ${
                drivingMode ? 'bg-emerald-500/15 border-emerald-500/40' : 'bg-zinc-800/60 border-zinc-700/40'
              }`}
            >
              <div className="flex items-center gap-3">
                <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${drivingMode ? 'bg-emerald-500/20' : 'bg-zinc-700'}`}>
                  <span className="text-xl">🚗</span>
                </div>
                <div className="text-left">
                  <p className={`text-sm font-semibold ${drivingMode ? 'text-emerald-400' : 'text-white'}`}>
                    Driving Mode {drivingMode ? 'ON' : 'OFF'}
                  </p>
                  <p className="text-zinc-500 text-xs">Big buttons • Voice feedback</p>
                </div>
              </div>
              <div className={`w-12 h-7 rounded-full relative transition-colors ${drivingMode ? 'bg-emerald-500' : 'bg-zinc-700'}`}>
                <div className={`absolute top-1 w-5 h-5 bg-white rounded-full shadow-lg transition-all ${drivingMode ? 'right-1' : 'left-1'}`} />
              </div>
            </button>
          </div>

          <div className="px-5 mb-4">
            <div className="grid grid-cols-3 gap-2">
              <div className="bg-zinc-800/60 rounded-xl p-3 text-center border border-zinc-700/30">
                <p className="text-xl font-bold text-white">{history.length}</p>
                <p className="text-[10px] text-zinc-500 mt-0.5">Messages</p>
              </div>
              <div className="bg-zinc-800/60 rounded-xl p-3 text-center border border-zinc-700/30">
                <p className="text-xl font-bold text-emerald-400">
                  {history.length > 0 ? Math.round(history.reduce((a,b) => a + b.score, 0) / history.length) : '--'}%
                </p>

      );

      return (
        <div className="w-full sm:max-w-sm mx-auto h-screen sm:h-[700px] relative overflow-hidden sm:rounded-3xl sm:border sm:border-zinc-700/50" style={{ background: 'linear-gradient(180deg, #18181B 0%, #09090B 100%)' }}>
          {screen === 'home' && <HomeScreen />}
          {screen === 'record' && <RecordScreen />}
          {screen === 'review' && <ReviewScreen />}
          {screen === 'history' && <HistoryScreen />}
          {screen === 'learn' && <LearnScreen />}
          {screen === 'settings' && <SettingsScreen />}
        </div>
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<WriteRight />);
  </script>
</body>
</html>
