      const rules = [
        { pattern: /\bi seen\b/gi, replacement: "I saw", rule: "Past tense of 'see'", explanation: "'Seen' needs a helper verb (have/had). On its own, use 'saw'.", category: "grammar" },

        { pattern: /!(?=[A-Za-z])/g, replacement: "! ", rule: "Space after exclamation", explanation: "Always put a space after an exclamation point.", category: "punctuation" },
        { pattern: /\s{2,}/g, replacement: " ", rule: "Remove extra spaces", explanation: "Use single spaces between words.", category: "punctuation" }
      ];
      
      rules.forEach(rule => {
        const matches = text.match(rule.pattern);
        if (matches) {
          matches.forEach(match => {
            corrections.push({
              original: match,
              corrected: match.replace(rule.pattern, rule.replacement),
              rule: rule.rule,
              explanation: rule.explanation,
              category: rule.category
            });
          });
          correctedText = correctedText.replace(rule.pattern, rule.replacement);
        }
      });
      
      // Capitalize first letter of text
      if (correctedText.length > 0 && correctedText[0] !== correctedText[0].toUpperCase()) {
        const original = correctedText[0];
        correctedText = correctedText[0].toUpperCase() + correctedText.slice(1);
        corrections.push({
          original: original,
          corrected: correctedText[0],
          rule: "Capitalize first word",
          explanation: "Always capitalize the first word of a sentence.",
          category: "punctuation"
        });
      }
      
      // Calculate score
      const wordCount = text.split(/\s+/).filter(w => w).length;
      const errorRate = wordCount > 0 ? corrections.length / wordCount : 0;
      let score = Math.max(0, Math.round(100 - (errorRate * 200)));
      if (corrections.length === 0) score = 100;
      
      return { corrections, correctedText, score };
    };

                <span className="text-zinc-500 text-xs">History</span>
              </button>
              <button onClick={() => setScreen('learn')} className="flex flex-col items-center py-2 px-4 rounded-xl">
                <svg className="w-6 h-6 text-zinc-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
                <span className="text-zinc-500 text-xs">Tips</span>
              </button>
            </div>
          </div>
        </div>
      );

      // RECORD SCREEN
      const RecordScreen = () => (
        <div className="flex flex-col h-full">
          <div className="px-5 pt-6 pb-3 flex items-center justify-between">
            <button onClick={() => { setIsRecording(false); if(recognitionRef.current) recognitionRef.current.stop(); setScreen('home'); }} className="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center">
              <svg className="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
            <div className="flex items-center gap-2">
              <div className="w-2 h-2 rounded-full bg-red-500 animate-pulse" />
              <span className="text-red-400 text-sm font-medium">Recording</span>
            </div>
            <div className="w-10" />
          </div>
          
          <div className="flex-1 flex flex-col items-center justify-center px-5">
            <div className="w-24 h-24 rounded-full bg-red-500 flex items-center justify-center mb-8 animate-pulse record-btn-recording">
              <svg className="w-10 h-10 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
              </svg>
            </div>
            
            <div className="w-full max-h-48 overflow-y-auto mb-6 bg-zinc-800/50 rounded-xl p-4 min-h-24">
              <p className="text-zinc-300 text-center leading-relaxed">
                {transcript || <span className="text-zinc-600">Listening...</span>}
              </p>
            </div>
            
            <button 
              onClick={stopRecording}
              className="w-full py-4 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-semibold transition-colors"
            >
              Done Speaking
            </button>
          </div>
        </div>
      );

      // REVIEW SCREEN
      const ReviewScreen = () => (
        <div className="flex flex-col h-full">
          <div className="px-5 pt-6 pb-3 flex items-center justify-between">
            <button onClick={() => setScreen('home')} className="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center">
              <svg className="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
              </svg>
            </button>
            <div className="flex items-center gap-2">
              <span className={`text-2xl font-black ${result?.score >= 80 ? 'text-emerald-400' : result?.score >= 60 ? 'text-amber-400' : 'text-red-400'}`}>
                {result?.score}
              </span>
              <span className="text-zinc-500 text-sm">/100</span>
            </div>
            <div className="w-10" />
          </div>
          
          <div className="flex-1 overflow-auto px-5 pb-6">
            {/* Corrected Text */}
            <div className="mb-4">
              <div className="flex items-center justify-between mb-2">
                <span className="text-zinc-500 text-xs uppercase tracking-wider font-medium">Corrected</span>
                <button 
                  onClick={() => copyToClipboard(result?.correctedText)}
                  className="flex items-center gap-1 text-emerald-400 text-xs font-medium"
                >
                  {copyFeedback || (
                    <>
                      <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                      </svg>
                      Copy
                    </>
                  )}
                </button>
              </div>
              <div className="bg-zinc-800/80 rounded-xl p-4 border border-emerald-500/30">
                <p className="text-white leading-relaxed">{result?.correctedText}</p>
              </div>
            </div>
            
            {/* Original */}
            <div className="mb-4">
              <span className="text-zinc-500 text-xs uppercase tracking-wider font-medium block mb-2">Original</span>
              <div className="bg-zinc-800/50 rounded-xl p-4 border border-zinc-700/40">
                <p className="text-zinc-400 leading-relaxed">{transcript}</p>
              </div>
            </div>
            
            {/* Corrections */}
            {result?.corrections?.length > 0 && (
              <div>
                <span className="text-zinc-500 text-xs uppercase tracking-wider font-medium block mb-2">
                  {result.corrections.length} Correction{result.corrections.length !== 1 ? 's' : ''}
                </span>
                <div className="space-y-2">
                  {result.corrections.slice(0, correctionMode === 'quick' ? 3 : result.corrections.length).map((c, i) => (
                    <div key={i} className={`rounded-xl p-3 border ${
                      c.category === 'grammar' ? 'bg-red-500/10 border-red-500/30' :
                      c.category === 'punctuation' ? 'bg-amber-500/10 border-amber-500/30' :
                      c.category === 'word_choice' ? 'bg-blue-500/10 border-blue-500/30' :
                      'bg-zinc-800/50 border-zinc-700/40'
                    }`}>
                      <div className="flex items-center gap-2 mb-1">
                        <span className="text-red-400 line-through text-sm">{c.original}</span>
                        <svg className="w-3 h-3 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                        <span className="text-emerald-400 font-medium text-sm">{c.corrected}</span>
                      </div>
                      <p className="text-zinc-500 text-xs">{c.rule}</p>
                      {correctionMode === 'learn' && (
                        <p className="text-zinc-600 text-xs mt-1">{c.explanation}</p>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}
            
            {result?.corrections?.length === 0 && (
              <div className="text-center py-6">
                <div className="w-16 h-16 rounded-full bg-emerald-500/20 flex items-center justify-center mx-auto mb-3">
                  <svg className="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                  </svg>
                </div>
                <p className="text-emerald-400 font-semibold">Perfect!</p>
                <p className="text-zinc-500 text-sm">No corrections needed</p>
              </div>
            )}
          </div>
          
          {/* Bottom Actions */}
          <div className="px-5 pb-6 flex gap-3">
            <button 
              onClick={() => { setTranscript(''); setResult(null); startRecording(); }}
              className="flex-1 py-3 rounded-xl bg-zinc-800 text-zinc-300 font-medium"
            >
              New Recording
            </button>
            <button 
              onClick={() => copyToClipboard(result?.correctedText)}
              className="flex-1 py-3 rounded-xl bg-emerald-500 text-white font-medium"
            >
              Copy & Use
            </button>
          </div>
        </div>
      );

      // HISTORY SCREEN
      const HistoryScreen = () => (
        <div className="flex flex-col h-full">
          <div className="px-5 pt-6 pb-3 flex items-center justify-between">
            <button onClick={() => setScreen('home')} className="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center">
              <svg className="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg>
            </button>
            <h2 className="text-white font-bold text-lg">History</h2>
            <div className="w-10" />
          </div>
          <div className="flex-1 overflow-auto px-5 pb-6">
            {history.length === 0 ? (
              <div className="flex flex-col items-center justify-center h-full text-center">
                <div className="w-16 h-16 rounded-full bg-zinc-800 flex items-center justify-center mb-4">
                  <svg className="w-8 h-8 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                </div>
                <p className="text-zinc-400 font-medium">No messages yet</p>
                <p className="text-zinc-600 text-sm mt-1">Your history will appear here</p>
              </div>
            ) : (
              <div className="space-y-2">
                {history.map((item) => (
                  <div key={item.id} className="bg-zinc-800/80 rounded-xl p-4 border border-zinc-700/40">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-zinc-500 text-xs">{item.timestamp}</span>
                      <div className="flex items-center gap-2">
                        <span className={`font-bold text-sm ${item.score >= 80 ? 'text-emerald-400' : item.score >= 60 ? 'text-amber-400' : 'text-red-400'}`}>{item.score}</span>
                        <span className="text-zinc-600 text-xs">{item.corrections} fixes</span>
                      </div>
                    </div>
                    <p className="text-zinc-300 text-sm line-clamp-2">{item.corrected}</p>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );

      // LEARN SCREEN
      const LearnScreen = () => (
        <div className="flex flex-col h-full">
          <div className="px-5 pt-6 pb-3 flex items-center justify-between">
            <button onClick={() => setScreen('home')} className="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center">
              <svg className="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg>
            </button>
            <h2 className="text-white font-bold text-lg">Quick Tips</h2>
            <div className="w-10" />
          </div>
          <div className="flex-1 overflow-auto px-5 pb-6">
            <div className="space-y-3">
              {[
                { title: "Your vs You're", tip: "'You're' = 'you are'. If you can say 'you are', use 'you're'.", icon: "🔤" },
                { title: "I saw (not 'I seen')", tip: "'Seen' needs a helper: 'I have seen'. Alone, use 'saw'.", icon: "📝" },
                { title: "A lot (two words)", tip: "'A lot' is always two words. 'Alot' doesn't exist.", icon: "✏️" },
                { title: "Should have (not 'of')", tip: "It sounds like 'of' but it's 'have'. Same for could/would.", icon: "📝" },
                { title: "Than vs Then", tip: "'Than' compares. 'Then' is time.", icon: "🔤" },
                { title: "There vs Their vs They're", tip: "There = place. Their = possession. They're = they are.", icon: "🔤" },
                { title: "It's vs Its", tip: "'It's' = 'it is'. 'Its' = possession (no apostrophe!).", icon: "✏️" },
                { title: "We're vs Were", tip: "'We're' = 'we are'. 'Were' is past tense.", icon: "🔤" },
              ].map((item, i) => (
                <div key={i} className="bg-zinc-800/80 rounded-xl p-4 border border-zinc-700/40">
                  <div className="flex items-center gap-3 mb-2">
                    <span className="text-xl">{item.icon}</span>
                    <p className="text-white font-semibold">{item.title}</p>
                  </div>
                  <p className="text-zinc-400 text-sm leading-relaxed">{item.tip}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );

      // SETTINGS SCREEN
      const SettingsScreen = () => (
        <div className="flex flex-col h-full">
          <div className="px-5 pt-6 pb-3 flex items-center justify-between">
            <button onClick={() => setScreen('home')} className="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center">
              <svg className="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg>
            </button>
            <h2 className="text-white font-bold text-lg">Settings</h2>
            <div className="w-10" />
          </div>
          <div className="flex-1 overflow-auto px-5 pb-6">
            <div className="mb-6">
              <h3 className="text-zinc-400 text-xs uppercase tracking-wider mb-3 font-medium">Default Mode</h3>
              <div className="bg-zinc-800/80 rounded-xl border border-zinc-700/40 overflow-hidden">
                {[
                  { id: 'quick', label: 'Quick Fix', desc: 'Just fix it' },
                  { id: 'learn', label: 'Learn Why', desc: 'See explanations' }
                ].map((mode, i) => (
                  <button key={mode.id} onClick={() => setCorrectionMode(mode.id)} className={`w-full p-4 flex items-center justify-between ${i > 0 ? 'border-t border-zinc-700/50' : ''}`} style={{ borderTopWidth: i > 0 ? '1px' : '0', borderTopColor: 'rgba(63, 63, 70, 0.5)' }}>
                    <div className="text-left">
                      <p className="text-white font-medium">{mode.label}</p>
                      <p className="text-zinc-500 text-sm">{mode.desc}</p>
                    </div>
                    <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center ${correctionMode === mode.id ? 'bg-emerald-500 border-emerald-500' : 'border-zinc-600'}`} style={{ backgroundColor: correctionMode === mode.id ? '#10b981' : 'transparent', borderColor: correctionMode === mode.id ? '#10b981' : '#52525b' }}>
                      {correctionMode === mode.id && <svg className="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" /></svg>}
                    </div>
                  </button>
                ))}
              </div>
            </div>
            <div className="bg-zinc-800/80 rounded-xl p-5 border border-zinc-700/40 text-center">
              <h1 className="text-xl font-black mb-1"><span className="text-emerald-400">Write</span><span className="text-white">Right</span></h1>
              <p className="text-zinc-500 text-sm">v1.0</p>
              <p className="text-zinc-600 text-xs mt-2">Speak it. Send it right.</p>
              <div className="flex items-center justify-center gap-2 mt-3">
                <div className="w-2 h-2 rounded-full bg-emerald-500" style={{ backgroundColor: '#10b981' }} />
                <span className="text-emerald-400 text-xs">Voice recognition active</span>
              </div>
            </div>
          </div>
        </div>
      );

      return (
        <div className="w-full sm:max-w-sm mx-auto h-screen sm:h-[700px] relative overflow-hidden sm:rounded-3xl sm:border border-zinc-700/50 app-container">
          {screen === 'home' && <HomeScreen />}
          {screen === 'record' && <RecordScreen />}
          {screen === 'review' && <ReviewScreen />}
          {screen === 'history' && <HistoryScreen />}
          {screen === 'learn' && <LearnScreen />}
          {screen === 'settings' && <SettingsScreen />}
        </div>
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<WriteRight />);
  </script>
</body>
</html>
