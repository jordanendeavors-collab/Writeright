<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09090B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WriteRight - Talk Sloppy. Text Sharp.</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #09090B;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      color: white;
      overflow-x: hidden;
    }
    
    .app {
      max-width: 420px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      background: radial-gradient(ellipse at top, #1a1a2e 0%, #09090B 50%);
    }
    
    /* Header */
    .header {
      padding: 20px 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    /* Logo */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon { width: 36px; height: 36px; }
    .logo-text { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .logo-write { color: #10b981; }
    .logo-right { color: #fff; }
    
    /* Tagline */
    .tagline-area { padding: 8px 20px 20px; }
    .tagline { color: #6b7280; font-size: 13px; font-weight: 500; }
    .tagline-highlight { color: #10b981; }
    
    .main { flex: 1; display: flex; flex-direction: column; padding: 0 20px 20px; }
    
    /* Mode Toggle - Now 3 options */
    .mode-toggle {
      display: flex;
      background: rgba(255,255,255,0.05);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .mode-btn {
      flex: 1;
      padding: 12px 8px;
      border: none;
      background: transparent;
      color: #6b7280;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(16,185,129,0.3);
    }
    .mode-btn.video-active {
      background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
      box-shadow: 0 4px 15px rgba(139,92,246,0.3);
    }
    
    /* Record Area */
    .record-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }
    
    /* Record Button Wrapper */
    .record-btn-wrapper {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .record-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(16,185,129,0.3);
      animation: ring-pulse 2s ease-out infinite;
    }
    .record-ring:nth-child(2) { animation-delay: 0.5s; }
    .record-ring:nth-child(3) { animation-delay: 1s; }
    
    @keyframes ring-pulse {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }
    
    .record-btn {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(145deg, #10b981, #059669);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(16,185,129,0.4), inset 0 -4px 10px rgba(0,0,0,0.2);
      transition: all 0.2s;
      z-index: 2;
    }
    .record-btn:hover { transform: scale(1.05); }
    .record-btn:active { transform: scale(0.95); }
    
    .record-btn.recording {
      background: linear-gradient(145deg, #ef4444, #dc2626);
      box-shadow: 0 0 60px rgba(239,68,68,0.5);
      animation: recording-pulse 1s ease-in-out infinite;
    }
    .recording .record-ring { border-color: rgba(239,68,68,0.4); }
    
    @keyframes recording-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    
    .mic-icon svg, .video-icon svg { width: 48px; height: 48px; fill: white; }
    
    /* Sound waves */
    .sound-waves {
      position: absolute;
      bottom: -30px;
      display: flex;
      gap: 4px;
      align-items: flex-end;
      height: 20px;
    }
    .wave-bar {
      width: 4px;
      background: linear-gradient(to top, #10b981, #34d399);
      border-radius: 2px;
      animation: wave 0.5s ease-in-out infinite;
    }
    .wave-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
    .wave-bar:nth-child(2) { height: 16px; animation-delay: 0.1s; }
    .wave-bar:nth-child(3) { height: 12px; animation-delay: 0.2s; }
    .wave-bar:nth-child(4) { height: 20px; animation-delay: 0.3s; }
    .wave-bar:nth-child(5) { height: 12px; animation-delay: 0.4s; }
    .wave-bar:nth-child(6) { height: 16px; animation-delay: 0.5s; }
    .wave-bar:nth-child(7) { height: 8px; animation-delay: 0.6s; }
    
    .recording .wave-bar { background: linear-gradient(to top, #ef4444, #f87171); }
    @keyframes wave {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.5); }
    }
    .idle .wave-bar { animation: none; opacity: 0.3; }
    
    .record-text { margin-top: 50px; text-align: center; }
    .record-text p { color: #e5e7eb; font-weight: 600; font-size: 16px; }
    .record-text small { color: #6b7280; font-size: 13px; display: block; margin-top: 4px; }
    
    /* Type Mode */
    .type-area { width: 100%; flex: 1; display: flex; flex-direction: column; }
    .type-area textarea {
      flex: 1;
      min-height: 160px;
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 16px;
      color: white;
      font-size: 16px;
      line-height: 1.6;
      resize: none;
      outline: none;
    }
    .type-area textarea:focus { border-color: rgba(16,185,129,0.5); }
    .type-area textarea::placeholder { color: #4b5563; }
    
    /* Video Mode */
    .video-area { width: 100%; flex: 1; display: flex; flex-direction: column; }
    .video-preview-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .video-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.3);
    }
    .video-timer {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.7);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .timer-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      animation: timer-pulse 1s infinite;
    }
    @keyframes timer-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .timer-warning { color: #fbbf24; }
    .timer-critical { color: #ef4444; }
    
    .video-record-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(145deg, #8b5cf6, #7c3aed);
      border: 4px solid white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(139,92,246,0.4);
      transition: all 0.2s;
    }
    .video-record-btn:hover { transform: scale(1.05); }
    .video-record-btn.recording {
      background: #ef4444;
      animation: recording-pulse 1s infinite;
    }
    .video-record-btn .inner {
      width: 24px;
      height: 24px;
      background: white;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .video-record-btn:not(.recording) .inner {
      border-radius: 50%;
    }
    
    .video-controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 16px;
    }
    
    .video-hint {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-top: 12px;
    }
    
    /* Primary Button */
    .primary-btn {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(16,185,129,0.3);
      transition: all 0.2s;
    }
    .primary-btn:hover { transform: translateY(-2px); }
    .primary-btn:disabled { background: #27272a; color: #4b5563; cursor: not-allowed; box-shadow: none; }
    .primary-btn.purple {
      background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
      box-shadow: 0 4px 15px rgba(139,92,246,0.3);
    }
    
    /* Transcript Box */
    .transcript-box {
      width: 100%;
      min-height: 80px;
      max-height: 160px;
      overflow-y: auto;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .transcript-box p { color: #e5e7eb; line-height: 1.6; font-size: 15px; }
    .transcript-box .interim { color: #6b7280; font-style: italic; }
    .transcript-box .placeholder { color: #4b5563; }
    
    /* Results */
    .results { padding: 0 20px 20px; flex: 1; overflow-y: auto; }
    
    .score-display { text-align: center; padding: 20px 0; }
    .score-circle {
      width: 100px;
      height: 100px;
      margin: 0 auto 12px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 800;
    }
    .score-circle.good { background: rgba(16,185,129,0.15); color: #34d399; border: 3px solid #10b981; }
    .score-circle.ok { background: rgba(245,158,11,0.15); color: #fbbf24; border: 3px solid #f59e0b; }
    .score-circle.bad { background: rgba(239,68,68,0.15); color: #f87171; border: 3px solid #ef4444; }
    .score-label { color: #6b7280; font-size: 14px; }
    
    .result-section { margin-bottom: 16px; }
    .result-label {
      color: #6b7280;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .copy-btn {
      background: none;
      border: none;
      color: #10b981;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .result-box {
      background: rgba(255,255,255,0.03);
      border-radius: 14px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .result-box.corrected { border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
    .result-box p { line-height: 1.6; font-size: 15px; }
    .result-box.original p { color: #9ca3af; }
    
    .correction-item {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .correction-item.word { background: rgba(59,130,246,0.08); border-color: rgba(59,130,246,0.2); }
    .correction-change { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .correction-old { color: #f87171; text-decoration: line-through; font-size: 14px; }
    .correction-arrow { color: #6b7280; font-size: 12px; }
    .correction-new { color: #34d399; font-weight: 600; font-size: 14px; }
    .correction-rule { color: #9ca3af; font-size: 12px; font-weight: 500; }
    .correction-explain { color: #6b7280; font-size: 12px; margin-top: 4px; }
    
    .perfect-box { text-align: center; padding: 30px 20px; }
    .perfect-icon {
      width: 80px;
      height: 80px;
      background: rgba(16,185,129,0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      border: 3px solid #10b981;
    }
    .perfect-icon svg { width: 40px; height: 40px; stroke: #34d399; fill: none; stroke-width: 3; }
    .perfect-text { color: #34d399; font-weight: 700; font-size: 20px; }
    .perfect-sub { color: #6b7280; font-size: 14px; margin-top: 6px; }
    
    .action-btns { display: flex; gap: 12px; margin-top: 24px; }
    .action-btn {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-btn.secondary { background: rgba(255,255,255,0.08); color: #e5e7eb; border: 1px solid rgba(255,255,255,0.1); }
    .action-btn.primary { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; }
    .share-btn { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }
    .email-btn { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    .sms-btn { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
    
    /* Video Result */
    .video-result-container {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .video-result {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .video-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .video-info-item {
      text-align: center;
    }
    .video-info-label { color: #6b7280; font-size: 11px; text-transform: uppercase; }
    .video-info-value { color: #e5e7eb; font-size: 16px; font-weight: 600; margin-top: 2px; }
    
    /* Back button */
    .back-btn {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .back-btn svg { width: 20px; height: 20px; stroke: #9ca3af; fill: none; stroke-width: 2; }
    
    .status-dot {
      width: 10px;
      height: 10px;
      background: #ef4444;
      border-radius: 50%;
      animation: status-pulse 1s infinite;
    }
    @keyframes status-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.2); }
    }
    .status-text { color: #f87171; font-size: 15px; font-weight: 600; }
    
    .features {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 16px 20px;
      margin-top: auto;
    }
    .feature { display: flex; align-items: center; gap: 6px; color: #6b7280; font-size: 11px; font-weight: 500; }
    
    /* Camera permission */
    .camera-prompt {
      text-align: center;
      padding: 40px 20px;
    }
    .camera-icon {
      width: 80px;
      height: 80px;
      background: rgba(139,92,246,0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .camera-icon svg { width: 40px; height: 40px; fill: #8b5cf6; }
    .camera-prompt h3 { color: #e5e7eb; margin-bottom: 8px; }
    .camera-prompt p { color: #6b7280; font-size: 14px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // Logo SVG
    const LogoIcon = () => (
      <svg viewBox="0 0 40 40" className="logo-icon">
        <path d="M8 28L24 12L28 16L12 32L6 34L8 28Z" fill="#10b981"/>
        <path d="M6 34L8 28L12 32L6 34Z" fill="#059669"/>
        <path d="M24 12L28 8L32 12L28 16L24 12Z" fill="#f87171"/>
        <path d="M20 22L26 28L34 18" stroke="#34d399" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
      </svg>
    );

    const MicIcon = () => (
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    );

    const VideoIcon = () => (
      <svg viewBox="0 0 24 24">
        <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
      </svg>
    );

    const taglines = [
      { main: "Talk Sloppy.", highlight: "Text Sharp." },
      { main: "Speak Freely.", highlight: "Send Professionally." },
      { main: "Your Voice.", highlight: "Polished Words." },
      { main: "Say It Wrong.", highlight: "Send It Right." },
    ];

    // Grammar checker
    function checkGrammar(text) {
      const rules = [
        { find: /\byour\s+(going|doing|coming|welcome|right|wrong|late|next|the|a|so|very)\b/gi, fix: "you're $1", rule: "You're vs Your", explain: "'You're' = 'you are'", cat: "word" },
        { find: /\btheir\s+(is|are|was|were|going|the|a)\b/gi, fix: "there $1", rule: "There vs Their", explain: "'There' for existence", cat: "word" },
        { find: /\bits\s+(a|the|going|not|been|so|very)\b/gi, fix: "it's $1", rule: "It's vs Its", explain: "'It's' = 'it is'", cat: "word" },
        { find: /\bi seen\b/gi, fix: "I saw", rule: "I saw", explain: "'Seen' needs helper verb", cat: "grammar" },
        { find: /\bshould of\b/gi, fix: "should have", rule: "Should HAVE", explain: "Sounds like 'of' but it's 'have'", cat: "grammar" },
        { find: /\bcould of\b/gi, fix: "could have", rule: "Could HAVE", explain: "Sounds like 'of' but it's 'have'", cat: "grammar" },
        { find: /\bwould of\b/gi, fix: "would have", rule: "Would HAVE", explain: "Sounds like 'of' but it's 'have'", cat: "grammar" },
        { find: /\balot\b/gi, fix: "a lot", rule: "Two words", explain: "'A lot' is always two words", cat: "grammar" },
        { find: /\bgonna\b/gi, fix: "going to", rule: "Informal", explain: "Use 'going to' professionally", cat: "word" },
        { find: /\bwanna\b/gi, fix: "want to", rule: "Informal", explain: "Use 'want to' professionally", cat: "word" },
        { find: /\bgotta\b/gi, fix: "got to", rule: "Informal", explain: "Use 'got to' professionally", cat: "word" },
        { find: /\bthey was\b/gi, fix: "they were", rule: "They WERE", explain: "'They' is plural", cat: "grammar" },
        { find: /\bwe was\b/gi, fix: "we were", rule: "We WERE", explain: "'We' is plural", cat: "grammar" },
        { find: /\bdont\b/gi, fix: "don't", rule: "Apostrophe", explain: "'Don't' = 'do not'", cat: "punct" },
        { find: /\bcant\b/gi, fix: "can't", rule: "Apostrophe", explain: "'Can't' = 'cannot'", cat: "punct" },
        { find: /\bwont\b/gi, fix: "won't", rule: "Apostrophe", explain: "'Won't' = 'will not'", cat: "punct" },
        { find: /\bi\b(?!')/g, fix: "I", rule: "Capitalize I", explain: "Always capitalize 'I'", cat: "punct" },
        { find: /\bim\b/gi, fix: "I'm", rule: "I'm", explain: "'I'm' = 'I am'", cat: "punct" },
        { find: /\bto\s+(much|many|late|early|soon|hard|fast|long|short)\b/gi, fix: "too $1", rule: "Too vs To", explain: "'Too' = excessive", cat: "word" },
        { find: /\bbetter\s+then\b/gi, fix: "better than", rule: "Than vs Then", explain: "'Than' for comparisons", cat: "word" },
      ];

      let corrected = text.trim();
      const corrections = [];

      rules.forEach(r => {
        const matches = corrected.match(r.find);
        if (matches) {
          matches.forEach(m => {
            const fixed = m.replace(r.find, r.fix);
            if (m.toLowerCase() !== fixed.toLowerCase()) {
              corrections.push({ old: m, new: fixed, rule: r.rule, explain: r.explain, cat: r.cat });
            }
          });
          corrected = corrected.replace(r.find, r.fix);
        }
      });

      if (corrected && /^[a-z]/.test(corrected)) {
        corrections.push({ old: corrected[0], new: corrected[0].toUpperCase(), rule: "Capitalize", explain: "Capitalize first word", cat: "punct" });
        corrected = corrected[0].toUpperCase() + corrected.slice(1);
      }

      const words = text.split(/\s+/).filter(w => w).length;
      const score = Math.max(0, Math.round(100 - (corrections.length / Math.max(words, 1)) * 150));

      return { corrected, corrections, score: corrections.length === 0 ? 100 : score };
    }

    // Share functions
    function shareToMessages(text) {
      if (navigator.share) {
        navigator.share({ text }).catch(() => {
          window.location.href = `sms:?body=${encodeURIComponent(text)}`;
        });
      } else {
        window.location.href = `sms:?body=${encodeURIComponent(text)}`;
      }
    }

    // Video share with better fallbacks
    async function shareVideo(blob, method) {
      const file = new File([blob], `WriteRight-Video-${Date.now()}.webm`, { type: 'video/webm' });
      
      // Always try native share first for any method
      const tryNativeShare = async () => {
        if (navigator.share) {
          try {
            // Try with file first
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({ files: [file], title: 'Video from WriteRight' });
              return true;
            }
            // Try without file (just triggers share sheet on some devices)
            await navigator.share({ title: 'Video from WriteRight', text: 'Check out this video message!' });
            // If we get here, share sheet opened but no file - download too
            downloadVideo(blob);
            return true;
          } catch (err) {
            if (err.name !== 'AbortError') {
              console.log('Share failed:', err);
            }
            return false;
          }
        }
        return false;
      };

      if (method === 'share') {
        const shared = await tryNativeShare();
        if (!shared) {
          downloadVideo(blob);
          showShareTip('Video downloaded! Open your preferred app and attach the video from your Downloads folder.');
        }
      } else if (method === 'email') {
        downloadVideo(blob);
        showShareTip('Video downloading... Opening email app. Attach the video from your Downloads folder.');
        setTimeout(() => {
          window.location.href = 'mailto:?subject=Video%20Message%20from%20WriteRight&body=Hi%2C%0A%0APlease%20see%20the%20attached%20video%20message.%0A%0ASent%20via%20WriteRight';
        }, 800);
      } else if (method === 'sms') {
        const shared = await tryNativeShare();
        if (!shared) {
          downloadVideo(blob);
          showShareTip('Video downloaded! Open Messages and attach the video from your Downloads folder.');
        }
      } else {
        downloadVideo(blob);
      }
    }

    function downloadVideo(blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `WriteRight-Video-${Date.now()}.webm`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // Show tip toast
    function showShareTip(message) {
      // Remove existing tip
      const existing = document.getElementById('share-tip');
      if (existing) existing.remove();
      
      const tip = document.createElement('div');
      tip.id = 'share-tip';
      tip.style.cssText = `
        position: fixed;
        bottom: 100px;
        left: 20px;
        right: 20px;
        background: rgba(16, 185, 129, 0.95);
        color: white;
        padding: 16px;
        border-radius: 12px;
        font-size: 14px;
        text-align: center;
        z-index: 9999;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        animation: slideUp 0.3s ease;
      `;
      tip.textContent = message;
      document.body.appendChild(tip);
      
      // Add animation
      const style = document.createElement('style');
      style.textContent = `@keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }`;
      document.head.appendChild(style);
      
      setTimeout(() => {
        tip.style.animation = 'slideUp 0.3s ease reverse';
        setTimeout(() => tip.remove(), 300);
      }, 5000);
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function App() {
      const [screen, setScreen] = useState('home');
      const [mode, setMode] = useState('voice');
      const [recording, setRecording] = useState(false);
      const [transcript, setTranscript] = useState('');
      const [interim, setInterim] = useState('');
      const [typed, setTyped] = useState('');
      const [result, setResult] = useState(null);
      const [copied, setCopied] = useState(false);
      const [taglineIndex, setTaglineIndex] = useState(0);
      
      // Video state
      const [cameraReady, setCameraReady] = useState(false);
      const [videoRecording, setVideoRecording] = useState(false);
      const [videoBlob, setVideoBlob] = useState(null);
      const [videoTime, setVideoTime] = useState(0);
      const [videoDuration, setVideoDuration] = useState(0);

      const recognitionRef = useRef(null);
      const recordingRef = useRef(false);
      const transcriptRef = useRef('');
      
      // Video refs
      const videoPreviewRef = useRef(null);
      const videoResultRef = useRef(null);
      const mediaRecorderRef = useRef(null);
      const streamRef = useRef(null);
      const chunksRef = useRef([]);
      const timerRef = useRef(null);

      // Rotate taglines
      useEffect(() => {
        const interval = setInterval(() => {
          setTaglineIndex(i => (i + 1) % taglines.length);
        }, 4000);
        return () => clearInterval(interval);
      }, []);

      // Setup speech recognition
      useEffect(() => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return;

        const rec = new SR();
        rec.continuous = false;
        rec.interimResults = true;
        rec.lang = 'en-US';

        rec.onresult = (e) => {
          const res = e.results[0];
          if (res.isFinal) {
            transcriptRef.current = (transcriptRef.current + ' ' + res[0].transcript).trim();
            setTranscript(transcriptRef.current);
            setInterim('');
          } else {
            setInterim(res[0].transcript);
          }
        };

        rec.onend = () => {
          if (recordingRef.current) {
            setTimeout(() => {
              if (recordingRef.current) {
                try { rec.start(); } catch(e) {}
              }
            }, 100);
          }
        };

        rec.onerror = (e) => {
          if (e.error !== 'no-speech' && e.error !== 'aborted') {
            setRecording(false);
            recordingRef.current = false;
          }
        };

        recognitionRef.current = rec;
      }, []);

      // Setup camera when video mode selected
      const setupCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, 
            audio: true 
          });
          streamRef.current = stream;
          if (videoPreviewRef.current) {
            videoPreviewRef.current.srcObject = stream;
          }
          setCameraReady(true);
        } catch (err) {
          console.error('Camera error:', err);
          alert('Could not access camera. Please allow camera permissions.');
        }
      };

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(track => track.stop());
          streamRef.current = null;
        }
        setCameraReady(false);
      };

      // Handle mode change
      useEffect(() => {
        if (mode === 'video' && screen === 'home') {
          setupCamera();
        } else {
          stopCamera();
        }
        return () => stopCamera();
      }, [mode, screen]);

      const startRecording = () => {
        transcriptRef.current = '';
        setTranscript('');
        setInterim('');
        setRecording(true);
        recordingRef.current = true;
        setScreen('record');
        try { recognitionRef.current?.start(); } catch(e) {}
      };

      const stopRecording = () => {
        setRecording(false);
        recordingRef.current = false;
        try { recognitionRef.current?.stop(); } catch(e) {}
        
        const text = transcriptRef.current.trim();
        if (text) {
          setResult(checkGrammar(text));
          setScreen('results');
        } else {
          setScreen('home');
        }
      };

      const checkTyped = () => {
        if (!typed.trim()) return;
        setTranscript(typed);
        setResult(checkGrammar(typed));
        setScreen('results');
      };

      // Video recording functions
      const startVideoRecording = () => {
        if (!streamRef.current) return;
        
        chunksRef.current = [];
        const mediaRecorder = new MediaRecorder(streamRef.current, { mimeType: 'video/webm' });
        
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) {
            chunksRef.current.push(e.data);
          }
        };
        
        mediaRecorder.onstop = () => {
          const blob = new Blob(chunksRef.current, { type: 'video/webm' });
          setVideoBlob(blob);
          setVideoDuration(videoTime);
          setScreen('videoResult');
          stopCamera();
        };
        
        mediaRecorderRef.current = mediaRecorder;
        mediaRecorder.start(1000);
        setVideoRecording(true);
        setVideoTime(0);
        
        // Timer
        timerRef.current = setInterval(() => {
          setVideoTime(t => {
            if (t >= 89) {
              stopVideoRecording();
              return 90;
            }
            return t + 1;
          });
        }, 1000);
      };

      const stopVideoRecording = () => {
        if (timerRef.current) {
          clearInterval(timerRef.current);
          timerRef.current = null;
        }
        if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
          mediaRecorderRef.current.stop();
        }
        setVideoRecording(false);
      };

      const copyText = (text) => {
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 1500);
      };

      const goHome = () => {
        setScreen('home');
        setTranscript('');
        setInterim('');
        setTyped('');
        setResult(null);
        setVideoBlob(null);
        setVideoTime(0);
        setVideoDuration(0);
        if (timerRef.current) clearInterval(timerRef.current);
      };

      const currentTagline = taglines[taglineIndex];

      // HOME SCREEN
      if (screen === 'home') {
        return (
          <div className="app">
            <div className="header">
              <div className="logo">
                <LogoIcon />
                <div className="logo-text">
                  <span className="logo-write">Write</span>
                  <span className="logo-right">Right</span>
                </div>
              </div>
            </div>
            
            <div className="tagline-area">
              <p className="tagline">
                {currentTagline.main} <span className="tagline-highlight">{currentTagline.highlight}</span>
              </p>
            </div>
            
            <div className="main">
              <div className="mode-toggle">
                <button className={`mode-btn ${mode === 'voice' ? 'active' : ''}`} onClick={() => setMode('voice')}>
                  🎤 Voice
                </button>
                <button className={`mode-btn ${mode === 'type' ? 'active' : ''}`} onClick={() => setMode('type')}>
                  ⌨️ Type
                </button>
                <button className={`mode-btn ${mode === 'video' ? 'active video-active' : ''}`} onClick={() => setMode('video')}>
                  🎥 Video
                </button>
              </div>

              {mode === 'voice' && (
                <div className="record-area">
                  <div className="record-btn-wrapper idle">
                    <div className="record-ring"></div>
                    <div className="record-ring"></div>
                    <div className="record-ring"></div>
                    <button className="record-btn" onClick={startRecording}>
                      <div className="mic-icon"><MicIcon /></div>
                    </button>
                    <div className="sound-waves">
                      {[...Array(7)].map((_, i) => <div key={i} className="wave-bar"></div>)}
                    </div>
                  </div>
                  <div className="record-text">
                    <p>Tap to speak</p>
                    <small>Voice-to-text with instant polish</small>
                  </div>
                </div>
              )}

              {mode === 'type' && (
                <div className="type-area">
                  <textarea 
                    placeholder="Type or paste your text here..."
                    value={typed}
                    onChange={(e) => setTyped(e.target.value)}
                  />
                  <button className="primary-btn" disabled={!typed.trim()} onClick={checkTyped}>
                    Check Grammar
                  </button>
                </div>
              )}

              {mode === 'video' && (
                <div className="video-area">
                  {!cameraReady ? (
                    <div className="camera-prompt">
                      <div className="camera-icon">
                        <VideoIcon />
                      </div>
                      <h3>Camera Access Needed</h3>
                      <p>Tap below to enable your camera for video recording</p>
                      <button className="primary-btn purple" onClick={setupCamera}>
                        Enable Camera
                      </button>
                    </div>
                  ) : (
                    <>
                      <div className="video-preview-container">
                        <video 
                          ref={videoPreviewRef} 
                          className="video-preview" 
                          autoPlay 
                          muted 
                          playsInline
                        />
                        {videoRecording && (
                          <div className={`video-timer ${videoTime >= 75 ? 'timer-critical' : videoTime >= 60 ? 'timer-warning' : ''}`}>
                            <div className="timer-dot"></div>
                            {formatTime(videoTime)} / 1:30
                          </div>
                        )}
                        <div className="video-overlay">
                          <button 
                            className={`video-record-btn ${videoRecording ? 'recording' : ''}`}
                            onClick={videoRecording ? stopVideoRecording : startVideoRecording}
                          >
                            <div className="inner"></div>
                          </button>
                        </div>
                      </div>
                      <div className="video-hint">
                        {videoRecording 
                          ? 'Tap the square to stop recording' 
                          : 'Tap the circle to start recording (90 sec max)'}
                      </div>
                    </>
                  )}
                </div>
              )}
            </div>
            
            <div className="features">
              <div className="feature"><span>⚡</span> Instant</div>
              <div className="feature"><span>🔒</span> Private</div>
              <div className="feature"><span>📱</span> Share Direct</div>
            </div>
          </div>
        );
      }

      // RECORDING SCREEN (Voice)
      if (screen === 'record') {
        return (
          <div className="app">
            <div className="header">
              <button className="back-btn" onClick={stopRecording}>
                <svg viewBox="0 0 24 24" strokeLinecap="round"><path d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
              <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                <div className="status-dot"></div>
                <span className="status-text">Recording</span>
              </div>
              <div style={{width:'44px'}}></div>
            </div>

            <div className="main">
              <div className="record-area">
                <div className="record-btn-wrapper recording">
                  <div className="record-ring"></div>
                  <div className="record-ring"></div>
                  <div className="record-ring"></div>
                  <button className="record-btn recording">
                    <div className="mic-icon"><MicIcon /></div>
                  </button>
                  <div className="sound-waves">
                    {[...Array(7)].map((_, i) => <div key={i} className="wave-bar"></div>)}
                  </div>
                </div>
              </div>

              <div className="transcript-box">
                <p>
                  {transcript}
                  {interim && <span className="interim"> {interim}</span>}
                  {!transcript && !interim && <span className="placeholder">Listening...</span>}
                </p>
              </div>

              <button className="primary-btn" onClick={stopRecording}>Done Speaking</button>
            </div>
          </div>
        );
      }

      // TEXT RESULTS SCREEN
      if (screen === 'results' && result) {
        const scoreClass = result.score >= 80 ? 'good' : result.score >= 60 ? 'ok' : 'bad';
        
        return (
          <div className="app">
            <div className="header">
              <button className="back-btn" onClick={goHome}>
                <svg viewBox="0 0 24 24" strokeLinecap="round"><path d="M15 19l-7-7 7-7"/></svg>
              </button>
              <div className="logo"><LogoIcon /></div>
              <div style={{width:'44px'}}></div>
            </div>

            <div className="results">
              <div className="score-display">
                <div className={`score-circle ${scoreClass}`}>{result.score}</div>
                <div className="score-label">Grammar Score</div>
              </div>

              <div className="result-section">
                <div className="result-label">
                  <span>Corrected</span>
                  <button className="copy-btn" onClick={() => copyText(result.corrected)}>
                    {copied ? '✓ Copied!' : '📋 Copy'}
                  </button>
                </div>
                <div className="result-box corrected">
                  <p>{result.corrected}</p>
                </div>
              </div>

              <div className="result-section">
                <div className="result-label"><span>Original</span></div>
                <div className="result-box original">
                  <p>{transcript}</p>
                </div>
              </div>

              {result.corrections.length > 0 ? (
                <div className="result-section">
                  <div className="result-label">
                    <span>{result.corrections.length} Correction{result.corrections.length !== 1 ? 's' : ''}</span>
                  </div>
                  {result.corrections.map((c, i) => (
                    <div key={i} className={`correction-item ${c.cat}`}>
                      <div className="correction-change">
                        <span className="correction-old">"{c.old}"</span>
                        <span className="correction-arrow">→</span>
                        <span className="correction-new">"{c.new}"</span>
                      </div>
                      <div className="correction-rule">{c.rule}</div>
                      <div className="correction-explain">{c.explain}</div>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="perfect-box">
                  <div className="perfect-icon">
                    <svg viewBox="0 0 24 24" strokeLinecap="round" strokeLinejoin="round"><path d="M5 13l4 4L19 7"/></svg>
                  </div>
                  <div className="perfect-text">Perfect!</div>
                  <div className="perfect-sub">No corrections needed</div>
                </div>
              )}

              <div className="action-btns">
                <button className="action-btn secondary" onClick={goHome}>New</button>
                <button className="action-btn primary share-btn" onClick={() => shareToMessages(result.corrected)}>
                  📩 Send
                </button>
              </div>
              
              <div className="action-btns" style={{marginTop: '8px'}}>
                <button className="action-btn primary" onClick={() => copyText(result.corrected)}>
                  📋 Copy Text
                </button>
              </div>
            </div>
          </div>
        );
      }

      // VIDEO RESULTS SCREEN
      if (screen === 'videoResult' && videoBlob) {
        const videoUrl = URL.createObjectURL(videoBlob);
        const fileSize = (videoBlob.size / (1024 * 1024)).toFixed(1);
        
        return (
          <div className="app">
            <div className="header">
              <button className="back-btn" onClick={goHome}>
                <svg viewBox="0 0 24 24" strokeLinecap="round"><path d="M15 19l-7-7 7-7"/></svg>
              </button>
              <div className="logo"><LogoIcon /></div>
              <div style={{width:'44px'}}></div>
            </div>

            <div className="results">
              <div className="video-result-container">
                <video 
                  ref={videoResultRef}
                  className="video-result" 
                  src={videoUrl} 
                  controls 
                  playsInline
                />
              </div>
              
              <div className="video-info">
                <div className="video-info-item">
                  <div className="video-info-label">Duration</div>
                  <div className="video-info-value">{formatTime(videoDuration)}</div>
                </div>
                <div className="video-info-item">
                  <div className="video-info-label">Size</div>
                  <div className="video-info-value">{fileSize} MB</div>
                </div>
                <div className="video-info-item">
                  <div className="video-info-label">Format</div>
                  <div className="video-info-value">WebM</div>
                </div>
              </div>

              <div className="action-btns">
                <button className="action-btn secondary" onClick={goHome}>New</button>
                <button className="action-btn primary share-btn" onClick={() => shareVideo(videoBlob, 'share')}>
                  📤 Share
                </button>
              </div>
              
              <div className="action-btns" style={{marginTop: '8px'}}>
                <button className="action-btn primary sms-btn" onClick={() => shareVideo(videoBlob, 'sms')}>
                  💬 Message
                </button>
                <button className="action-btn primary email-btn" onClick={() => shareVideo(videoBlob, 'email')}>
                  📧 Email
                </button>
              </div>
              
              <div className="action-btns" style={{marginTop: '8px'}}>
                <button className="action-btn secondary" onClick={() => downloadVideo(videoBlob)}>
                  ⬇️ Download Video
                </button>
              </div>
            </div>
          </div>
        );
      }

      return null;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
