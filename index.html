<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09090B">
  <title>WriteRight - Speak it. Send it right.</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #18181B 0%, #09090B 100%);
      min-height: 100vh;
      color: white;
    }
    .app {
      max-width: 400px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 24px 20px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 24px; font-weight: 900; }
    .logo-green { color: #34d399; }
    .tagline { padding: 0 20px 24px; color: #71717a; font-size: 14px; }
    
    .main { flex: 1; display: flex; flex-direction: column; padding: 20px; }
    
    /* Mode Toggle */
    .mode-toggle {
      display: flex;
      background: rgba(39,39,42,0.8);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
    }
    .mode-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #a1a1aa;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #10b981;
      color: white;
    }
    
    /* Record Button */
    .record-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .record-btn {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      background: #10b981;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 60px rgba(16,185,129,0.3);
      transition: transform 0.2s;
    }
    .record-btn:hover { transform: scale(1.05); }
    .record-btn:active { transform: scale(0.95); }
    .record-btn.recording {
      background: #ef4444;
      box-shadow: 0 0 60px rgba(239,68,68,0.4);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .record-btn svg { width: 56px; height: 56px; fill: white; }
    .record-text { margin-top: 24px; text-align: center; }
    .record-text p { color: #a1a1aa; font-weight: 500; }
    .record-text small { color: #52525b; font-size: 12px; }
    
    /* Textarea for Type Mode */
    .type-area { width: 100%; }
    .type-area textarea {
      width: 100%;
      height: 160px;
      background: rgba(39,39,42,0.8);
      border: 1px solid rgba(63,63,70,0.4);
      border-radius: 12px;
      padding: 16px;
      color: white;
      font-size: 16px;
      resize: none;
      outline: none;
    }
    .type-area textarea:focus { border-color: rgba(16,185,129,0.5); }
    .type-area textarea::placeholder { color: #52525b; }
    .check-btn {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      background: #10b981;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .check-btn:disabled { background: #27272a; color: #52525b; cursor: not-allowed; }
    
    /* Transcript Display */
    .transcript-box {
      width: 100%;
      min-height: 96px;
      max-height: 192px;
      overflow-y: auto;
      background: rgba(39,39,42,0.5);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .transcript-box p { color: #d4d4d8; line-height: 1.6; }
    .transcript-box .interim { color: #71717a; font-style: italic; }
    .transcript-box .placeholder { color: #52525b; }
    
    /* Results Screen */
    .results { padding: 20px; }
    .score-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .score { font-size: 32px; font-weight: 900; }
    .score.good { color: #34d399; }
    .score.ok { color: #fbbf24; }
    .score.bad { color: #f87171; }
    .score-label { color: #71717a; font-size: 14px; }
    
    .result-section { margin-bottom: 16px; }
    .result-label {
      color: #71717a;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .copy-btn {
      background: none;
      border: none;
      color: #34d399;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .result-box {
      background: rgba(39,39,42,0.8);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid rgba(63,63,70,0.4);
    }
    .result-box.corrected { border-color: rgba(16,185,129,0.3); }
    .result-box p { line-height: 1.6; }
    .result-box.original p { color: #a1a1aa; }
    
    .correction-item {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .correction-item.word { background: rgba(59,130,246,0.1); border-color: rgba(59,130,246,0.3); }
    .correction-item.punct { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.3); }
    .correction-change {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .correction-old { color: #f87171; text-decoration: line-through; font-size: 14px; }
    .correction-arrow { color: #71717a; }
    .correction-new { color: #34d399; font-weight: 500; font-size: 14px; }
    .correction-rule { color: #71717a; font-size: 12px; }
    .correction-explain { color: #52525b; font-size: 12px; margin-top: 4px; }
    
    .perfect-box {
      text-align: center;
      padding: 24px;
    }
    .perfect-icon {
      width: 64px;
      height: 64px;
      background: rgba(16,185,129,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }
    .perfect-icon svg { width: 32px; height: 32px; stroke: #34d399; fill: none; }
    .perfect-text { color: #34d399; font-weight: 600; }
    .perfect-sub { color: #71717a; font-size: 14px; margin-top: 4px; }
    
    .action-btns {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .action-btn {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      border: none;
      cursor: pointer;
    }
    .action-btn.secondary { background: #27272a; color: #d4d4d8; }
    .action-btn.primary { background: #10b981; color: white; }
    
    /* Back button */
    .back-btn {
      width: 40px;
      height: 40px;
      background: #27272a;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .back-btn svg { width: 20px; height: 20px; stroke: #a1a1aa; fill: none; }
    
    .status-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    .status-text { color: #f87171; font-size: 14px; font-weight: 500; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    // Simple grammar checker
    function checkGrammar(text) {
      const rules = [
        { find: /\byour\s+(going|doing|coming|welcome|right|wrong|late|next|the|a)\b/gi, fix: "you're $1", rule: "You're vs Your", explain: "'You're' = 'you are'" },
        { find: /\btheir\s+(is|are|was|were|going)\b/gi, fix: "there $1", rule: "There vs Their", explain: "'There' for existence, 'their' for possession" },
        { find: /\bits\s+(a|the|going|not|been)\b/gi, fix: "it's $1", rule: "It's vs Its", explain: "'It's' = 'it is'" },
        { find: /\bi seen\b/gi, fix: "I saw", rule: "I saw, not 'I seen'", explain: "'Seen' needs helper verb (have seen)" },
        { find: /\bshould of\b/gi, fix: "should have", rule: "Should HAVE", explain: "Sounds like 'of' but it's 'have'" },
        { find: /\bcould of\b/gi, fix: "could have", rule: "Could HAVE", explain: "Sounds like 'of' but it's 'have'" },
        { find: /\bwould of\b/gi, fix: "would have", rule: "Would HAVE", explain: "Sounds like 'of' but it's 'have'" },
        { find: /\balot\b/gi, fix: "a lot", rule: "Two words", explain: "'A lot' is always two words" },
        { find: /\bgonna\b/gi, fix: "going to", rule: "Informal", explain: "Use 'going to' in professional writing" },
        { find: /\bwanna\b/gi, fix: "want to", rule: "Informal", explain: "Use 'want to' in professional writing" },
        { find: /\bgotta\b/gi, fix: "got to", rule: "Informal", explain: "Use 'got to' in professional writing" },
        { find: /\bthey was\b/gi, fix: "they were", rule: "They WERE", explain: "'They' is plural, use 'were'" },
        { find: /\bwe was\b/gi, fix: "we were", rule: "We WERE", explain: "'We' is plural, use 'were'" },
        { find: /\bdont\b/gi, fix: "don't", rule: "Apostrophe", explain: "'Don't' = 'do not'" },
        { find: /\bcant\b/gi, fix: "can't", rule: "Apostrophe", explain: "'Can't' = 'cannot'" },
        { find: /\bwont\b/gi, fix: "won't", rule: "Apostrophe", explain: "'Won't' = 'will not'" },
        { find: /\bi\b(?!')/g, fix: "I", rule: "Capitalize I", explain: "Always capitalize 'I'" },
        { find: /\bim\b/gi, fix: "I'm", rule: "I'm", explain: "'I'm' = 'I am'" },
        { find: /\bto\s+(much|many|late|early|soon|hard|fast)\b/gi, fix: "too $1", rule: "Too vs To", explain: "'Too' = excessive" },
        { find: /\bbetter\s+then\b/gi, fix: "better than", rule: "Than vs Then", explain: "'Than' for comparisons" },
      ];

      let corrected = text.trim();
      const corrections = [];

      rules.forEach(r => {
        const matches = corrected.match(r.find);
        if (matches) {
          matches.forEach(m => {
            const fixed = m.replace(r.find, r.fix);
            if (m.toLowerCase() !== fixed.toLowerCase()) {
              corrections.push({ old: m, new: fixed, rule: r.rule, explain: r.explain });
            }
          });
          corrected = corrected.replace(r.find, r.fix);
        }
      });

      // Capitalize first letter
      if (corrected && /^[a-z]/.test(corrected)) {
        corrections.push({ old: corrected[0], new: corrected[0].toUpperCase(), rule: "Capitalize", explain: "Capitalize first word" });
        corrected = corrected[0].toUpperCase() + corrected.slice(1);
      }

      const words = text.split(/\s+/).filter(w => w).length;
      const score = Math.max(0, Math.round(100 - (corrections.length / Math.max(words, 1)) * 150));

      return { corrected, corrections, score: corrections.length === 0 ? 100 : score };
    }

    function App() {
      const [screen, setScreen] = useState('home');
      const [mode, setMode] = useState('voice');
      const [recording, setRecording] = useState(false);
      const [transcript, setTranscript] = useState('');
      const [interim, setInterim] = useState('');
      const [typed, setTyped] = useState('');
      const [result, setResult] = useState(null);
      const [copied, setCopied] = useState(false);

      const recognitionRef = useRef(null);
      const recordingRef = useRef(false);
      const transcriptRef = useRef('');

      // Setup speech recognition once
      useEffect(() => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return;

        const rec = new SR();
        rec.continuous = false;
        rec.interimResults = true;
        rec.lang = 'en-US';

        rec.onresult = (e) => {
          const res = e.results[0];
          if (res.isFinal) {
            const text = res[0].transcript;
            transcriptRef.current = (transcriptRef.current + ' ' + text).trim();
            setTranscript(transcriptRef.current);
            setInterim('');
          } else {
            setInterim(res[0].transcript);
          }
        };

        rec.onend = () => {
          if (recordingRef.current) {
            setTimeout(() => {
              if (recordingRef.current) {
                try { rec.start(); } catch(e) {}
              }
            }, 100);
          }
        };

        rec.onerror = (e) => {
          if (e.error !== 'no-speech' && e.error !== 'aborted') {
            setRecording(false);
            recordingRef.current = false;
          }
        };

        recognitionRef.current = rec;
      }, []);

      const startRecording = () => {
        transcriptRef.current = '';
        setTranscript('');
        setInterim('');
        setRecording(true);
        recordingRef.current = true;
        setScreen('record');
        try { recognitionRef.current?.start(); } catch(e) {}
      };

      const stopRecording = () => {
        setRecording(false);
        recordingRef.current = false;
        try { recognitionRef.current?.stop(); } catch(e) {}
        
        const text = transcriptRef.current.trim();
        if (text) {
          setResult(checkGrammar(text));
          setScreen('results');
        } else {
          setScreen('home');
        }
      };

      const checkTyped = () => {
        if (!typed.trim()) return;
        setTranscript(typed);
        setResult(checkGrammar(typed));
        setScreen('results');
      };

      const copyText = (text) => {
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 1500);
      };

      const goHome = () => {
        setScreen('home');
        setTranscript('');
        setInterim('');
        setTyped('');
        setResult(null);
      };

      // HOME SCREEN
      if (screen === 'home') {
        return (
          <div className="app">
            <div className="header">
              <div className="logo"><span className="logo-green">Write</span>Right</div>
            </div>
            <div className="tagline">Speak it. Send it right.</div>
            
            <div className="main">
              <div className="mode-toggle">
                <button className={`mode-btn ${mode === 'voice' ? 'active' : ''}`} onClick={() => setMode('voice')}>🎤 Voice</button>
                <button className={`mode-btn ${mode === 'type' ? 'active' : ''}`} onClick={() => setMode('type')}>⌨️ Type</button>
              </div>

              {mode === 'voice' ? (
                <div className="record-area">
                  <button className="record-btn" onClick={startRecording}>
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                  </button>
                  <div className="record-text">
                    <p>Tap to speak</p>
                    <small>Voice-to-text with grammar fixes</small>
                  </div>
                </div>
              ) : (
                <div className="type-area">
                  <textarea 
                    placeholder="Type or paste your text here..."
                    value={typed}
                    onChange={(e) => setTyped(e.target.value)}
                  />
                  <button className="check-btn" disabled={!typed.trim()} onClick={checkTyped}>
                    Check Grammar
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      }

      // RECORDING SCREEN
      if (screen === 'record') {
        return (
          <div className="app">
            <div className="header">
              <button className="back-btn" onClick={stopRecording}>
                <svg viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round"><path d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
              <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                <div className="status-dot"></div>
                <span className="status-text">Recording</span>
              </div>
              <div style={{width:'40px'}}></div>
            </div>

            <div className="main">
              <div className="record-area">
                <button className="record-btn recording">
                  <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                </button>
              </div>

              <div className="transcript-box">
                <p>
                  {transcript}
                  {interim && <span className="interim"> {interim}</span>}
                  {!transcript && !interim && <span className="placeholder">Listening...</span>}
                </p>
              </div>

              <button className="check-btn" onClick={stopRecording}>Done Speaking</button>
            </div>
          </div>
        );
      }

      // RESULTS SCREEN
      if (screen === 'results' && result) {
        const scoreClass = result.score >= 80 ? 'good' : result.score >= 60 ? 'ok' : 'bad';
        
        return (
          <div className="app">
            <div className="header">
              <button className="back-btn" onClick={goHome}>
                <svg viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round"><path d="M15 19l-7-7 7-7"/></svg>
              </button>
              <div className="score-header">
                <span className={`score ${scoreClass}`}>{result.score}</span>
                <span className="score-label">/100</span>
              </div>
              <div style={{width:'40px'}}></div>
            </div>

            <div className="results" style={{flex:1,overflowY:'auto'}}>
              <div className="result-section">
                <div className="result-label">
                  <span>Corrected</span>
                  <button className="copy-btn" onClick={() => copyText(result.corrected)}>
                    {copied ? '✓ Copied' : '📋 Copy'}
                  </button>
                </div>
                <div className="result-box corrected">
                  <p>{result.corrected}</p>
                </div>
              </div>

              <div className="result-section">
                <div className="result-label"><span>Original</span></div>
                <div className="result-box original">
                  <p>{transcript}</p>
                </div>
              </div>

              {result.corrections.length > 0 ? (
                <div className="result-section">
                  <div className="result-label"><span>{result.corrections.length} Correction{result.corrections.length !== 1 ? 's' : ''}</span></div>
                  {result.corrections.map((c, i) => (
                    <div key={i} className="correction-item">
                      <div className="correction-change">
                        <span className="correction-old">"{c.old}"</span>
                        <span className="correction-arrow">→</span>
                        <span className="correction-new">"{c.new}"</span>
                      </div>
                      <div className="correction-rule">{c.rule}</div>
                      <div className="correction-explain">{c.explain}</div>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="perfect-box">
                  <div className="perfect-icon">
                    <svg viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round"><path d="M5 13l4 4L19 7"/></svg>
                  </div>
                  <div className="perfect-text">Perfect!</div>
                  <div className="perfect-sub">No corrections needed</div>
                </div>
              )}

              <div className="action-btns">
                <button className="action-btn secondary" onClick={goHome}>New</button>
                <button className="action-btn primary" onClick={() => copyText(result.corrected)}>Copy & Use</button>
              </div>
            </div>
          </div>
        );
      }

      return null;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
