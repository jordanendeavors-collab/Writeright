    // GRAMMAR ANALYSIS ENGINE v2

    const analyzeGrammar = (text) => {
      const corrections = [];
      let correctedText = text;
      
      // Normalize text for analysis - trim and clean up spacing
      correctedText = correctedText.trim().replace(/\s+/g, ' ');
      
      const rules = [
        // === HOMOPHONE ERRORS (Speech API often gets these wrong) ===
        // your/you're - these are the BIG ones speech gets wrong
        { pattern: /\byour\s+(going|doing|coming|leaving|working|trying|getting|making|taking|running|saying|welcome|right|wrong|fired|hired|done|finished|late|early|next|up|here|there|ready)\b/gi, replacement: "you're $1", rule: "You're vs Your", explanation: "'You're' = 'you are'. 'Your' shows possession.", category: "word_choice" },

        { pattern: /\bshe\s+don't\b/gi, replacement: "she doesn't", rule: "He/She DOESN'T", explanation: "With he/she/it, use 'doesn't' not 'don't'.", category: "grammar" },

        // === WHERE...AT ===
        { pattern: /\bwhere\s+(?:is|are|was|were)\s+(?:he|she|it|they|you|we)\s+at\b/gi, replacement: match => match.replace(/\s+at$/, ''), rule: "Redundant 'at'", explanation: "'Where' already implies location. 'At' is unnecessary.", category: "grammar" },

        { pattern: /\bdont\b/gi, replacement: "don't", rule: "Apostrophe", explanation: "'Don't' = 'do not'.", category: "punctuation" },

        { pattern: /\bshouldnt\b/gi, replacement: "shouldn't", rule: "Apostrophe", explanation: "'Shouldn't' = 'should not'.", category: "punctuation" },
        { pattern: /\bhasnt\b/gi, replacement: "hasn't", rule: "Apostrophe", explanation: "'Hasn't' = 'has not'.", category: "punctuation" },
        { pattern: /\bhavent\b/gi, replacement: "haven't", rule: "Apostrophe", explanation: "'Haven't' = 'have not'.", category: "punctuation" },
        { pattern: /\bthats\b/gi, replacement: "that's", rule: "Apostrophe", explanation: "'That's' = 'that is'.", category: "punctuation" },
        { pattern: /\bwhats\b/gi, replacement: "what's", rule: "Apostrophe", explanation: "'What's' = 'what is'.", category: "punctuation" },
        { pattern: /\bheres\b/gi, replacement: "here's", rule: "Apostrophe", explanation: "'Here's' = 'here is'.", category: "punctuation" },
        { pattern: /\btheres\b/gi, replacement: "there's", rule: "Apostrophe", explanation: "'There's' = 'there is'.", category: "punctuation" },
        { pattern: /\bwheres\b/gi, replacement: "where's", rule: "Apostrophe", explanation: "'Where's' = 'where is'.", category: "punctuation" },
        { pattern: /\blets\b(?!\s+(?:go|see|do|try|get|make|take|check|find|call|start))/g, replacement: "let's", rule: "Apostrophe", explanation: "'Let's' = 'let us'.", category: "punctuation" },
        { pattern: /\bim\b/gi, replacement: "I'm", rule: "Apostrophe + Capitalize", explanation: "'I'm' = 'I am'.", category: "punctuation" },
        { pattern: /\bive\b/gi, replacement: "I've", rule: "Apostrophe + Capitalize", explanation: "'I've' = 'I have'.", category: "punctuation" },
        { pattern: /\bill\b(?!\s)/gi, replacement: "I'll", rule: "Apostrophe + Capitalize", explanation: "'I'll' = 'I will'.", category: "punctuation" },
        
        // === PUNCTUATION SPACING ===
        { pattern: /\s+([.,!?])/g, replacement: "$1", rule: "No space before punctuation", explanation: "Punctuation goes right after the word.", category: "punctuation" },
        { pattern: /([.,!?])(?=[A-Za-z])/g, replacement: "$1 ", rule: "Space after punctuation", explanation: "Add space after punctuation.", category: "punctuation" },
        { pattern: /\s{2,}/g, replacement: " ", rule: "Single spaces", explanation: "Use single spaces between words.", category: "punctuation" },
        
        // === SECURITY INDUSTRY SPECIFIC ===
        { pattern: /\balarm\s+(?:went|is\s+going|goes)\s+off\b/gi, replacement: "alarm activated", rule: "Industry term", explanation: "'Alarm activated' is more professional.", category: "industry" },
        { pattern: /\bpanel\s+(?:is|was)\s+(?:acting|being)\s+(?:weird|crazy|funny|strange)\b/gi, replacement: "panel is experiencing issues", rule: "Industry term", explanation: "Be specific about panel behavior.", category: "industry" },
        { pattern: /\bsensor\s+(?:is|was)\s+(?:going|acting)\s+(?:crazy|nuts|haywire|weird)\b/gi, replacement: "sensor is malfunctioning", rule: "Industry term", explanation: "'Malfunctioning' is professional.", category: "industry" },
      ];
      
      // Apply rules
      rules.forEach(rule => {
        const matches = correctedText.match(rule.pattern);
        if (matches) {
          matches.forEach(match => {
            let corrected;
            if (typeof rule.replacement === 'function') {
              corrected = match.replace(rule.pattern, rule.replacement);
            } else {
              corrected = match.replace(rule.pattern, rule.replacement);
            }
            if (match.toLowerCase() !== corrected.toLowerCase()) {
              corrections.push({
                original: match,
                corrected: corrected,
                rule: rule.rule,
                explanation: rule.explanation,
                category: rule.category
              });
            }
          });
          if (typeof rule.replacement === 'function') {
            correctedText = correctedText.replace(rule.pattern, rule.replacement);
          } else {
            correctedText = correctedText.replace(rule.pattern, rule.replacement);
          }
        }
      });
      
      // Capitalize first letter if needed
      if (correctedText.length > 0 && /[a-z]/.test(correctedText[0])) {
        const original = correctedText[0];
        correctedText = correctedText[0].toUpperCase() + correctedText.slice(1);
        corrections.push({
          original: original,
          corrected: correctedText[0],
          rule: "Capitalize first word",
          explanation: "Always capitalize the first word.",
          category: "punctuation"
        });
      }
      
      // Remove duplicate corrections
      const uniqueCorrections = corrections.filter((c, i, arr) => 
        arr.findIndex(x => x.original === c.original && x.corrected === c.corrected) === i
      );
      
      // Calculate score
      const wordCount = text.split(/\s+/).filter(w => w).length;
      const errorRate = wordCount > 0 ? uniqueCorrections.length / wordCount : 0;
      let score = Math.max(0, Math.round(100 - (errorRate * 150)));
      if (uniqueCorrections.length === 0) score = 100;
      
      return { corrections: uniqueCorrections, correctedText, score };
    };

    // ========================================
    // MAIN APP COMPONENT
    // ========================================
    function WriteRight() {
      const [screen, setScreen] = useState('home');
      const [isRecording, setIsRecording] = useState(false);
      const [finalTranscript, setFinalTranscript] = useState('');
      const [interimTranscript, setInterimTranscript] = useState('');
      const [result, setResult] = useState(null);
      const [history, setHistory] = useState([]);
      const [correctionMode, setCorrectionMode] = useState('learn');
      const [copyFeedback, setCopyFeedback] = useState('');
      const [manualInput, setManualInput] = useState('');
      const [inputMode, setInputMode] = useState('voice'); // 'voice' or 'type'
      
      const recognitionRef = useRef(null);
      const isRecordingRef = useRef(false); // Ref to avoid stale closure

      // Keep ref in sync with state
      useEffect(() => {
        isRecordingRef.current = isRecording;
      }, [isRecording]);

      // Initialize speech recognition ONCE
      useEffect(() => {
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          const recognition = new SpeechRecognition();
          
          recognition.continuous = true;
          recognition.interimResults = true;
          recognition.lang = 'en-US';
          recognition.maxAlternatives = 1;
          
          recognition.onresult = (event) => {
            let interim = '';
            let final = '';
            
            // Process only from resultIndex to avoid duplication
            for (let i = event.resultIndex; i < event.results.length; i++) {
              const transcript = event.results[i][0].transcript;
              if (event.results[i].isFinal) {
                final += transcript;
              } else {
                interim += transcript;
              }
            }
            
            // Append final results, replace interim
            if (final) {
              setFinalTranscript(prev => prev + final);
            }
            setInterimTranscript(interim);
          };
          
          recognition.onerror = (event) => {
            console.error('Speech recognition error:', event.error);
            if (event.error === 'no-speech') {
              // This is common, don't stop recording
              return;
            }
            if (event.error !== 'aborted') {
              setIsRecording(false);
            }
          };
          
          recognition.onend = () => {
            // Use ref to get current value, not stale closure
            if (isRecordingRef.current) {
              try {
                recognition.start();
              } catch (e) {
                // Already started, ignore
              }
            }
          };
          
          recognitionRef.current = recognition;
        }
        
        // Cleanup
        return () => {
          if (recognitionRef.current) {
            try {
              recognitionRef.current.stop();
            } catch (e) {}
          }
        };
      }, []); // Empty deps - only run once

      const startRecording = useCallback(() => {
        setFinalTranscript('');
        setInterimTranscript('');
        setIsRecording(true);
        isRecordingRef.current = true;
        
        if (recognitionRef.current) {
          try {
            recognitionRef.current.start();
          } catch (e) {
            console.error('Failed to start recognition:', e);
          }
        }
        setScreen('record');
      }, []);

      const stopRecording = useCallback(() => {
        setIsRecording(false);
        isRecordingRef.current = false;
        
        if (recognitionRef.current) {
          try {
            recognitionRef.current.stop();
          } catch (e) {}
        }
        
        // Combine final + any remaining interim
        const fullTranscript = (finalTranscript + ' ' + interimTranscript).trim();
        
        if (fullTranscript) {
          const analysisResult = analyzeGrammar(fullTranscript);
          setResult(analysisResult);
          
          const historyItem = {
            id: Date.now(),
            original: fullTranscript,
            corrected: analysisResult.correctedText,
            score: analysisResult.score,
            corrections: analysisResult.corrections.length,
            timestamp: new Date().toLocaleString('en-US', { 
              month: 'short', 
              day: 'numeric', 
              hour: 'numeric', 
              minute: '2-digit',
              hour12: true 
            })
          };
          setHistory(prev => [historyItem, ...prev.slice(0, 49)]);
          
          setScreen('review');
        } else {
          setScreen('home');
        }
      }, [finalTranscript, interimTranscript]);

      const analyzeManualInput = useCallback(() => {
        if (!manualInput.trim()) return;
        
        const analysisResult = analyzeGrammar(manualInput);
        setResult(analysisResult);
        
        const historyItem = {
          id: Date.now(),
          original: manualInput,
          corrected: analysisResult.correctedText,
          score: analysisResult.score,
          corrections: analysisResult.corrections.length,
          timestamp: new Date().toLocaleString('en-US', { 
            month: 'short', 
            day: 'numeric', 
            hour: 'numeric', 
            minute: '2-digit',
            hour12: true 
          })
        };
        setHistory(prev => [historyItem, ...prev.slice(0, 49)]);
        setFinalTranscript(manualInput);
        setManualInput('');
        setScreen('review');
      }, [manualInput]);

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text).then(() => {
          setCopyFeedback('Copied!');
          setTimeout(() => setCopyFeedback(''), 1500);
        });
      };

      // Get combined transcript for display
      const displayTranscript = finalTranscript + (interimTranscript ? ' ' + interimTranscript : '');

      // HOME SCREEN
      const HomeScreen = () => (
        <div className="flex flex-col h-full">
          <div className="px-5 pt-6 pb-2 flex items-center justify-between">
            <h1 className="text-2xl font-black">
              <span className="text-emerald-400">Write</span>
              <span className="text-white">Right</span>
            </h1>
            <button 
              onClick={() => setScreen('settings')}
              className="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center"
            >
              <svg className="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>
          </div>
          
          <div className="px-5 pb-4">
            <p className="text-zinc-500 text-sm">Speak it. Send it right.</p>
          </div>
          
          {/* Mode Toggle */}
          <div className="px-5 mb-4">
            <div className="flex bg-zinc-800/80 rounded-xl p-1">
              <button 
                onClick={() => setInputMode('voice')}
                className={`flex-1 py-2 rounded-lg text-sm font-medium transition-colors ${inputMode === 'voice' ? 'bg-emerald-500 text-white' : 'text-zinc-400'}`}
              >
                🎤 Voice
              </button>
              <button 
                onClick={() => setInputMode('type')}
                className={`flex-1 py-2 rounded-lg text-sm font-medium transition-colors ${inputMode === 'type' ? 'bg-emerald-500 text-white' : 'text-zinc-400'}`}
              >
                ⌨️ Type
              </button>
            </div>
          </div>
          
          {/* Main Content */}
          <div className="flex-1 flex items-center justify-center px-5">
            {inputMode === 'voice' ? (
              <div className="text-center">
                <button 
                  onClick={startRecording}
                  className="w-32 h-32 rounded-full bg-emerald-500 flex items-center justify-center mx-auto mb-6 transition-all duration-200 hover:scale-105 active:scale-95 record-btn-glow"
                >
                  <svg className="w-14 h-14 text-white" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                  </svg>
                </button>
                <p className="text-zinc-400 font-medium mb-1">Tap to speak</p>
                <p className="text-zinc-600 text-sm">Voice-to-text with instant grammar fixes</p>
              </div>
            ) : (
              <div className="w-full">
                <textarea
                  value={manualInput}
                  onChange={(e) => setManualInput(e.target.value)}
                  placeholder="Type or paste your text here..."
                  className="w-full h-40 bg-zinc-800/80 rounded-xl p-4 text-white placeholder-zinc-600 border border-zinc-700/40 resize-none outline-none focus:border-emerald-500/50"
                />
                <button 
                  onClick={analyzeManualInput}
                  disabled={!manualInput.trim()}
                  className={`w-full mt-4 py-4 rounded-xl font-semibold transition-colors ${manualInput.trim() ? 'bg-emerald-500 hover:bg-emerald-600 text-white' : 'bg-zinc-800 text-zinc-600 cursor-not-allowed'}`}
                >
                  Check Grammar
                </button>
              </div>
            )}
          </div>
          
          {/* Bottom Nav */}
          <div className="px-5 pb-6 pt-4">
            <div className="flex items-center justify-around bg-zinc-800/80 rounded-2xl p-2">
              <button onClick={() => setScreen('history')} className="flex flex-col items-center py-2 px-4 rounded-xl">
                <svg className="w-6 h-6 text-zinc-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span className="text-zinc-500 text-xs">History</span>
              </button>
              <button onClick={() => setScreen('learn')} className="flex flex-col items-center py-2 px-4 rounded-xl">
                <svg className="w-6 h-6 text-zinc-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
                <span className="text-zinc-500 text-xs">Tips</span>
              </button>
            </div>
          </div>
        </div>
      );

      // RECORD SCREEN
      const RecordScreen = () => (
        <div className="flex flex-col h-full">
          <div className="px-5 pt-6 pb-3 flex items-center justify-between">
            <button onClick={() => { setIsRecording(false); isRecordingRef.current = false; if(recognitionRef.current) { try { recognitionRef.current.stop(); } catch(e){} } setScreen('home'); }} className="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center">
              <svg className="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
            <div className="flex items-center gap-2">
              <div className="w-2 h-2 rounded-full bg-red-500 animate-pulse" />
              <span className="text-red-400 text-sm font-medium">Recording</span>
            </div>
            <div className="w-10" />
          </div>
          
          <div className="flex-1 flex flex-col items-center justify-center px-5">
            <div className="w-24 h-24 rounded-full bg-red-500 flex items-center justify-center mb-8 recording-pulse">
              <svg className="w-10 h-10 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
              </svg>
            </div>
            
            <div className="w-full max-h-48 overflow-y-auto mb-6 bg-zinc-800/50 rounded-xl p-4 min-h-24">
              <p className="text-zinc-300 text-center leading-relaxed">
                {finalTranscript}
                {interimTranscript && <span className="interim-text"> {interimTranscript}</span>}
                {!displayTranscript && <span className="text-zinc-600">Listening...</span>}
              </p>
            </div>
            
            <button 
              onClick={stopRecording}
              className="w-full py-4 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-semibold transition-colors"
            >
              Done Speaking
            </button>
          </div>
        </div>
      );

      // REVIEW SCREEN
      const ReviewScreen = () => (
        <div className="flex flex-col h-full">
          <div className="px-5 pt-6 pb-3 flex items-center justify-between">
            <button onClick={() => setScreen('home')} className="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center">
              <svg className="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
              </svg>
            </button>
            <div className="flex items-center gap-2">
              <span className={`text-2xl font-black ${result?.score >= 80 ? 'text-emerald-400' : result?.score >= 60 ? 'text-amber-400' : 'text-red-400'}`}>
                {result?.score}
              </span>
              <span className="text-zinc-500 text-sm">/100</span>
            </div>
            <div className="w-10" />
          </div>
          
          <div className="flex-1 overflow-auto px-5 pb-6">
            {/* Corrected Text */}
            <div className="mb-4">
              <div className="flex items-center justify-between mb-2">
                <span className="text-zinc-500 text-xs uppercase tracking-wider font-medium">Corrected</span>
                <button 
                  onClick={() => copyToClipboard(result?.correctedText)}
                  className="flex items-center gap-1 text-emerald-400 text-xs font-medium"
                >
                  {copyFeedback || (
                    <>
                      <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                      </svg>
                      Copy
                    </>
                  )}
                </button>
              </div>
              <div className="bg-zinc-800/80 rounded-xl p-4 border border-emerald-500/30">
                <p className="text-white leading-relaxed">{result?.correctedText}</p>
              </div>
            </div>
            
            {/* Original */}
            <div className="mb-4">
              <span className="text-zinc-500 text-xs uppercase tracking-wider font-medium block mb-2">Original</span>
              <div className="bg-zinc-800/50 rounded-xl p-4 border border-zinc-700/40">
                <p className="text-zinc-400 leading-relaxed">{finalTranscript}</p>
              </div>
            </div>
            
            {/* Corrections */}
            {result?.corrections?.length > 0 && (
              <div>
                <span className="text-zinc-500 text-xs uppercase tracking-wider font-medium block mb-2">
                  {result.corrections.length} Correction{result.corrections.length !== 1 ? 's' : ''}
                </span>
                <div className="space-y-2">
                  {result.corrections.map((c, i) => (
                    <div key={i} className={`rounded-xl p-3 border ${
                      c.category === 'grammar' ? 'bg-red-500/10 border-red-500/30' :
                      c.category === 'punctuation' ? 'bg-amber-500/10 border-amber-500/30' :
                      c.category === 'word_choice' ? 'bg-blue-500/10 border-blue-500/30' :
                      c.category === 'industry' ? 'bg-emerald-500/10 border-emerald-500/30' :
                      'bg-zinc-800/50 border-zinc-700/40'
                    }`}>
                      <div className="flex items-center gap-2 mb-1 flex-wrap">
                        <span className="text-red-400 line-through text-sm">"{c.original}"</span>
                        <svg className="w-3 h-3 text-zinc-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                        <span className="text-emerald-400 font-medium text-sm">"{c.corrected}"</span>
                      </div>
                      <p className="text-zinc-500 text-xs">{c.rule}</p>
                      {correctionMode === 'learn' && (
                        <p className="text-zinc-600 text-xs mt-1">{c.explanation}</p>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}
            
            {result?.corrections?.length === 0 && (
              <div className="text-center py-6">
                <div className="w-16 h-16 rounded-full bg-emerald-500/20 flex items-center justify-center mx-auto mb-3">
                  <svg className="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                  </svg>
                </div>
                <p className="text-emerald-400 font-semibold">Perfect!</p>
                <p className="text-zinc-500 text-sm">No corrections needed</p>
              </div>
            )}
          </div>
          
          {/* Bottom Actions */}
          <div className="px-5 pb-6 flex gap-3">
            <button 
              onClick={() => { setFinalTranscript(''); setInterimTranscript(''); setResult(null); setScreen('home'); }}
              className="flex-1 py-3 rounded-xl bg-zinc-800 text-zinc-300 font-medium"
            >
              New
            </button>
            <button 
              onClick={() => copyToClipboard(result?.correctedText)}
              className="flex-1 py-3 rounded-xl bg-emerald-500 text-white font-medium"
            >
              Copy & Use
            </button>
          </div>
        </div>
      );

      // HISTORY SCREEN
      const HistoryScreen = () => (
        <div className="flex flex-col h-full">
          <div className="px-5 pt-6 pb-3 flex items-center justify-between">
            <button onClick={() => setScreen('home')} className="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center">
              <svg className="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg>
            </button>
            <h2 className="text-white font-bold text-lg">History</h2>
            <div className="w-10" />
          </div>
          <div className="flex-1 overflow-auto px-5 pb-6">
            {history.length === 0 ? (
              <div className="flex flex-col items-center justify-center h-full text-center">
                <div className="w-16 h-16 rounded-full bg-zinc-800 flex items-center justify-center mb-4">
                  <svg className="w-8 h-8 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                </div>
                <p className="text-zinc-400 font-medium">No messages yet</p>
                <p className="text-zinc-600 text-sm mt-1">Your history will appear here</p>
              </div>
            ) : (
              <div className="space-y-2">
                {history.map((item) => (
                  <div key={item.id} className="bg-zinc-800/80 rounded-xl p-4 border border-zinc-700/40">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-zinc-500 text-xs">{item.timestamp}</span>
                      <div className="flex items-center gap-2">
                        <span className={`font-bold text-sm ${item.score >= 80 ? 'text-emerald-400' : item.score >= 60 ? 'text-amber-400' : 'text-red-400'}`}>{item.score}</span>
                        <span className="text-zinc-600 text-xs">{item.corrections} fix{item.corrections !== 1 ? 'es' : ''}</span>
                      </div>
                    </div>
                    <p className="text-zinc-300 text-sm line-clamp-2">{item.corrected}</p>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );

      // LEARN SCREEN
      const LearnScreen = () => (
        <div className="flex flex-col h-full">
          <div className="px-5 pt-6 pb-3 flex items-center justify-between">
            <button onClick={() => setScreen('home')} className="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center">
              <svg className="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg>
            </button>
            <h2 className="text-white font-bold text-lg">Quick Tips</h2>
            <div className="w-10" />
          </div>
          <div className="flex-1 overflow-auto px-5 pb-6">
            <div className="space-y-3">
              {[
                { title: "Your vs You're", tip: "'You're' = 'you are'. Try substituting - if 'you are' works, use 'you're'.", icon: "🔤" },
                { title: "Their vs There vs They're", tip: "'There' = location. 'Their' = possession. 'They're' = they are.", icon: "📍" },
                { title: "Its vs It's", tip: "'It's' = 'it is' (has apostrophe). 'Its' = possession (no apostrophe!).", icon: "✏️" },
                { title: "Than vs Then", tip: "'Than' compares (better THAN). 'Then' = time (first this, THEN that).", icon: "⚖️" },
                { title: "To vs Too vs Two", tip: "'Too' = excessive/also. 'To' = direction. 'Two' = the number 2.", icon: "2️⃣" },
                { title: "Should HAVE (not 'of')", tip: "It sounds like 'of' when spoken, but it's 'have'. Same for could/would.", icon: "📝" },
                { title: "I saw (not 'I seen')", tip: "'Seen' needs a helper: 'I have seen'. On its own, use 'saw'.", icon: "👀" },
                { title: "A lot (two words)", tip: "'A lot' is always two words. 'Alot' isn't a real word.", icon: "📏" },
              ].map((item, i) => (
                <div key={i} className="bg-zinc-800/80 rounded-xl p-4 border border-zinc-700/40">
                  <div className="flex items-center gap-3 mb-2">
                    <span className="text-xl">{item.icon}</span>
                    <p className="text-white font-semibold">{item.title}</p>
                  </div>
                  <p className="text-zinc-400 text-sm leading-relaxed">{item.tip}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );

      // SETTINGS SCREEN
      const SettingsScreen = () => (
        <div className="flex flex-col h-full">
          <div className="px-5 pt-6 pb-3 flex items-center justify-between">
            <button onClick={() => setScreen('home')} className="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center">
              <svg className="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg>
            </button>
            <h2 className="text-white font-bold text-lg">Settings</h2>
            <div className="w-10" />
          </div>
          <div className="flex-1 overflow-auto px-5 pb-6">
            <div className="mb-6">
              <h3 className="text-zinc-400 text-xs uppercase tracking-wider mb-3 font-medium">Correction Detail</h3>
              <div className="bg-zinc-800/80 rounded-xl border border-zinc-700/40 overflow-hidden">
                {[
                  { id: 'quick', label: 'Quick Fix', desc: 'Just show the fix' },
                  { id: 'learn', label: 'Learn Why', desc: 'Show explanations' }
                ].map((mode, i) => (
                  <button 
                    key={mode.id} 
                    onClick={() => setCorrectionMode(mode.id)} 
                    className="w-full p-4 flex items-center justify-between"
                    style={{ borderTop: i > 0 ? '1px solid rgba(63, 63, 70, 0.5)' : 'none' }}
                  >
                    <div className="text-left">
                      <p className="text-white font-medium">{mode.label}</p>
                      <p className="text-zinc-500 text-sm">{mode.desc}</p>
                    </div>
                    <div 
                      className="w-5 h-5 rounded-full border-2 flex items-center justify-center"
                      style={{ 
                        backgroundColor: correctionMode === mode.id ? '#10b981' : 'transparent', 
                        borderColor: correctionMode === mode.id ? '#10b981' : '#52525b' 
                      }}
                    >
                      {correctionMode === mode.id && (
                        <svg className="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20">
                          <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" />
                        </svg>
                      )}
                    </div>
                  </button>
                ))}
              </div>
            </div>
            
            <div className="bg-zinc-800/80 rounded-xl p-5 border border-zinc-700/40 text-center">
              <h1 className="text-xl font-black mb-1">
                <span className="text-emerald-400">Write</span>
                <span className="text-white">Right</span>
              </h1>
              <p className="text-zinc-500 text-sm">v2.0</p>
              <p className="text-zinc-600 text-xs mt-2">Speak it. Send it right.</p>
              <div className="flex items-center justify-center gap-2 mt-3">
                <div className="w-2 h-2 rounded-full" style={{ backgroundColor: '#10b981' }} />
                <span className="text-emerald-400 text-xs">
                  {('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) 
                    ? 'Voice recognition ready' 
                    : 'Voice not supported - use Type mode'}
                </span>
              </div>
            </div>
          </div>
        </div>
      );

      return (
        <div className="w-full sm:max-w-sm mx-auto h-screen sm:h-[700px] relative overflow-hidden sm:rounded-3xl sm:border border-zinc-700/50 app-container">
          {screen === 'home' && <HomeScreen />}
          {screen === 'record' && <RecordScreen />}
          {screen === 'review' && <ReviewScreen />}
          {screen === 'history' && <HistoryScreen />}
          {screen === 'learn' && <LearnScreen />}
          {screen === 'settings' && <SettingsScreen />}
        </div>
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<WriteRight />);
  </script>
</body>
</html>
